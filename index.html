<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CISP 自检 · 500 题</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #171c23;
    --card2: #1e242d;
    --line: #2a323d;
    --txt: #e8ecf1;
    --muted: #96a2b3;
    --accent: #4da3ff;
    --ok: #35c07f;
    --no: #f0614f;
    --warn: #e5a83c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --card: #fff; --card2: #f0f3f7; --line: #dde3ea;
      --txt: #1a1f26; --muted: #5f6c7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
  h2 { margin: 0 0 2px; font-size: 22px; }
  h3 { margin: 0 0 12px; font-size: 16px; }
  h4 { margin: 18px 0 8px; font-size: 14px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .center { text-align: center; }

  /* hero */
  .hero { display: flex; gap: 18px; align-items: center; }
  .hero-info { flex: 1; min-width: 0; }
  .ring-wrap { position: relative; width: 104px; height: 104px; flex: none; }
  .ring { width: 104px; height: 104px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--line); stroke-width: 9; }
  .ring-fg {
    fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round;
    transition: stroke-dasharray .6s ease;
  }
  .ring-txt {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1.1;
  }
  .ring-txt b { font-size: 22px; }
  .ring-txt span { font-size: 11px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 99px;
    background: var(--card2); border: 1px solid var(--line); color: var(--muted);
  }
  .chip.hot { color: var(--accent); border-color: var(--accent); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }

  /* tasks */
  .task-row { display: grid; gap: 10px; margin-bottom: 14px; }
  .task { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .pbar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
  .pbar.sm { height: 6px; }

  /* buttons */
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--card2);
    color: var(--txt); padding: 10px 16px; border-radius: 10px; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, .opt:focus-visible, .mode:focus-visible, .topic:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #05121f; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn.big { width: 100%; padding: 13px; font-size: 16px; margin-top: 4px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .btn-row .btn { flex: 1; }
  .icon-btn {
    appearance: none; background: none; border: none; color: var(--txt);
    font-size: 26px; line-height: 1; cursor: pointer; padding: 0 8px 0 0; font-family: inherit;
  }

  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .mode {
    display: flex; flex-direction: column; gap: 2px; text-align: left;
    background: var(--card2); border: 1px solid var(--line); color: var(--txt);
    padding: 12px 14px; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 15px;
  }
  .mode:hover:not(.disabled) { border-color: var(--accent); }
  .mode span { font-size: 12px; color: var(--muted); }
  .mode.disabled { opacity: .45; cursor: not-allowed; }

  .sel, .search, .field input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: var(--card2); border: 1px solid var(--line); color: var(--txt);
    font-size: 15px; font-family: inherit;
  }
  .search { margin: 10px 0 4px; }
  .field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }

  .topic-list { display: grid; gap: 8px; margin-top: 12px; }
  .topic {
    display: grid; grid-template-columns: 1fr 70px 52px; gap: 10px; align-items: center;
    background: none; border: none; border-bottom: 1px solid var(--line);
    color: var(--txt); padding: 9px 2px; cursor: pointer; text-align: left;
    font-size: 14px; font-family: inherit;
  }
  .topic:hover { background: var(--card2); }
  .tnum { font-size: 12px; color: var(--muted); text-align: right; }

  /* quiz */
  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .qprog { flex: 1; height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .qprog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .qcount { font-size: 12px; color: var(--muted); }
  .qmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: rgba(77,163,255,.14); color: var(--accent);
  }
  .tag.ghost { background: var(--card2); color: var(--muted); }
  .tag.lvl { background: rgba(53,192,127,.15); color: var(--ok); }
  .tag.warn { background: rgba(229,168,60,.16); color: var(--warn); }
  .stem { font-size: 16px; line-height: 1.75; margin: 4px 0 16px; white-space: pre-wrap; }

  .opts { display: grid; gap: 9px; }
  .opt {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
    text-align: left; background: var(--card2); border: 1px solid var(--line);
    color: var(--txt); padding: 12px 14px; border-radius: 11px; cursor: pointer;
    font-size: 15px; line-height: 1.65; font-family: inherit;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .k {
    width: 24px; height: 24px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--line); display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
  }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--ok); background: rgba(53,192,127,.12); }
  .opt.right .k { background: var(--ok); color: #04130b; border-color: var(--ok); }
  .opt.wrong { border-color: var(--no); background: rgba(240,97,79,.12); }
  .opt.wrong .k { background: var(--no); color: #1b0603; border-color: var(--no); }

  .feedback {
    margin: 14px 0 4px; padding: 11px 14px; border-radius: 11px;
    display: flex; flex-direction: column; gap: 2px; font-size: 14px;
  }
  .feedback.ok { background: rgba(53,192,127,.12); border: 1px solid var(--ok); }
  .feedback.no { background: rgba(240,97,79,.12); border: 1px solid var(--no); }
  .feedback .muted { font-size: 12px; }

  .big-score { font-size: 46px; font-weight: 700; color: var(--accent); line-height: 1.2; }

  .wrong-list, .browse { text-align: left; }
  .wrow, .brow {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; background: var(--card2);
  }
  .wrow summary, .brow summary { cursor: pointer; font-size: 14px; line-height: 1.6; }
  .brow summary.done { color: var(--ok); }
  .bt { font-size: 11px; color: var(--accent); margin-right: 4px; }
  .wopt { font-size: 13px; padding: 5px 0; color: var(--muted); border-top: 1px solid var(--line); margin-top: 6px; }
  .wopt.right { color: var(--ok); }
  .wopt.picked { color: var(--no); }

  .exam-hist { margin-top: 14px; }
  .exam-line { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    background: var(--txt); color: var(--bg); padding: 9px 18px; border-radius: 99px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

  <script>
window.BANK = [{"id":"core300-1","src":"精选300题","n":1,"q":"自 2004 年 1 月起,各有关部门在申报信息安全国家标准计划项目时,必须经由以下哪个组织提出工作情 况,协调一致后由该组织申报。(  )","o":[{"k":"A","t":"全国通信标准化技术委员会(TC485)"},{"k":"B","t":"全国信息安全标准化技术委员会(TC260)"},{"k":"C","t":"中国通信标准化协会(CA)"},{"k":"D","t":"网络与信息安全技术工作委员会"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"core300-2","src":"精选300题","n":2,"q":"安全管理体系,国际上有标准( Information technology Security tech nformation systems)(ISO/IEC 27001-2013),而我国发布了《信息技术信息安全管 理体系要求》(GBT 22080-2008)请问,这两个标准的关系是 (  )","o":[{"k":"A","t":"IDT(等同采用),此国家标准等同于该国际标准,仅有或没有编辑性修改"},{"k":"B","t":"EQV(等效采用),此国家标准等效于该国家标准,技术上只有很小差异"},{"k":"C","t":"AEQ(等效采用),此国家标准不等效于该国家标准"},{"k":"D","t":"没有采用与否的关系,两者之间版本不同,不应直接比较"}],"a":"D","topic":"法律法规与标准","partial":false},{"id":"core300-3","src":"精选300题","n":3,"q":"“cc”标准是测评标准类的重要标准,从该标准的内容来看,下面哪项内容是针对具体的被测评对象描述 了该对象的安全要求及其相关安全功能和安全措施,相当于从厂商角度制定的产品或系统实现方案(  )","o":[{"k":"A","t":"评估对象(TOE)"},{"k":"B","t":"保护轮廊(PP)"},{"k":"C","t":"安全目标(ST)"},{"k":"D","t":"评估保证级(EAL)"}],"a":"C","topic":"综合","partial":false},{"id":"core300-4","src":"精选300题","n":4,"q":"信息安全等级保护分级要求,第三级适用正确的是 (  )","o":[{"k":"A","t":"适用于一般的信息和信息系统,其受到破坏后,会对公民、法人和其他组织的权益有一定影响,但不危害国 家安全、社会秩序、经济建设和公共利益"},{"k":"B","t":"适用于一定程度上涉及国家安全、社会秩序、经济建设和公共利益的一般信息和信息系统,其受到破坏后, 会对国家安全、社会秩序、经济建设和公共利益造成一定损害"},{"k":"C","t":"适用于涉及国家安全、社会秩序、经济建设和公共利益的信息和信息系统,其受到破坏后会对国家安全、 社会秩序、经济建设和公共利益造成较大损害"},{"k":"D","t":"适用于涉及国家安全、社会秩序、经济建设和公共利益的重要信息和信息系统的核心子系统,其受到破坏 后,会对国家安全、社会秩序、经济建设和公共利益造成特别严重"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"core300-5","src":"精选300题","n":5,"q":"下面对国家秘密定級和范围的描述中,哪项不符合《保守国家秘密法》要求:(  )","o":[{"k":"A","t":"国家秘密及其密级的具体范围,由国家保密工作部门分别会同外交、公安、国家安全和其他中央有关机关 规定"},{"k":"B","t":"各级国家机关、单位对所产生的国家秘密事项,应当按照国家秘密及其密级具体范围的规定确定密级"},{"k":"C","t":"对是否属于国家机密和属于何种密级不明确的事项,可由各单位自行参考国家要求确定和定级,然后报国 家保密工作部门确定"},{"k":"D","t":"对是否属于国家秘密和属于何种密级不明确的事项。由国家保密工作部门,省、自治区、直辖市的保密工 作部门。省、自治区政府所在地的市和经国务院批准的较大的市的保密工作部门或者国家保密工作部门审 定的机关确定。"}],"a":"C","topic":"法律法规与标准","partial":false},{"id":"core300-6","src":"精选300题","n":6,"q":"为了保障网络安全,维护网络空间主权和国家安全、社会公共利益,保护公民、法人和其他组织的合法权 益,促进经济社会信息化健康发展,加强在中华人民共和国境内建设、运营、维护和使用网络,以及网络安全 的监督管理。2015 年 6 月,第十二届全国人大常委会第十五次会议初次审议了一部法律草案,并于 7 月 6 日 起在网上全文公布,向社会公开征求意见,这部法律是(  )","o":[{"k":"A","t":"《中华人民共和国保守国家秘密法》"},{"k":"B","t":"《中华人民共和国网络安全法》"},{"k":"C","t":"《中华人民共和国国家安全法》"},{"k":"D","t":"《中华人民共和国互联网安全法》"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"core300-7","src":"精选300题","n":7,"q":"为了进一步提高信息安全的保障能力和防护水平,保障和促进信息化建设的健康发展,公安部等四部门联 合发布《关于信息安全等级保护工作的实施意见》(公通字[2004166 号),对等级保护工作的开展提供宏观指 导和约東。明确了等级保护工作的基本内容、工作要求和实施计划,以及各部门工作职责分工等。关于该文 件,下面理解正确的是 (  )","o":[{"k":"A","t":"该文件是一个由部委发布的政策性文件,不属于法律文件。"},{"k":"B","t":"该文件适用于 2004 年的等级保护工作。其内容不能约束到 2005 年及之后的工作。"},{"k":"C","t":"该文件是一个总体性指导文件,规定了所有信息系统都要纳入等级保护定级范围"},{"k":"D","t":"该文件适用范围为发文的这四个部门,不适用于其他部门和企业等单位"}],"a":"A","topic":"法律法规与标准","partial":false},{"id":"core300-8","src":"精选300题","n":8,"q":"分组密码算法是一类十分重要的密码算法,下面描述中,错误的是(  )","o":[{"k":"A","t":"分组密码算法要求输入明文按组分成固定长度的块"},{"k":"B","t":"分组密码算法每次计算得到固定长度的密文输出块"},{"k":"C","t":"分组密码算法也称为序列密码算法"},{"k":"D","t":"常见的 DES、IDEA 算法都属于分组密码算法"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-9","src":"精选300题","n":9,"q":"密码学是网络安全的基础,但网络安全不能单纯依靠安全的密码算法,密码协议也是网络安全的个重要组 成部分。下面描述中,错误的是 (  )","o":[{"k":"A","t":"在实际应用中,密码协议应按照灵活性好、可扩展性高的方式制定,不要限制和框住所有的执行步骤,有些 复杂的步骤可以不明确处理方式"},{"k":"B","t":"密码协议定义了两方或多方之间为完成某项任务而制定的一系列步骤,协议中的每个参与方都必须了解 协议,且按步骤执行"},{"k":"C","t":"根据密码协议应用目的的不同,参与该协议的双方可能是朋友和完全信任的人,也可能是敌人和互相完全 不信任的人"},{"k":"D","t":"密码协议( cryptographic protoco1),有时也称安全协议( securityprot oco1)是使用密码学完成某项特定的任 务并满足安全需求,其目的是提供安全服务"}],"a":"A","topic":"密码学","partial":false},{"id":"core300-10","src":"精选300题","n":10,"q":"美国计算机协会(ACM)宣布将 2015 年的 ACM 奖授予给 Whitfield Diffiic 和 Artfield 下面哪项工作是他 们的贡献 (  )","o":[{"k":"A","t":"发明并第一个使用 c 语言"},{"k":"B","t":"第一个发表了对称密码算法思想"},{"k":"C","t":"第一个发表了非对称密码算法思想"},{"k":"D","t":"第一个研制出防火墙"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-11","src":"精选300题","n":11,"q":"虚拟专用网络(VPN)通常是指在公共网络中利用隧道技术,建立一个临时的、安全的网络。这里的字母 P 的正确解释是 (  )","o":[{"k":"A","t":  模型"}],"a":"A","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-17","src":"精选300题","n":17,"q":"强制访问控制是指主体和客体都有一个固定的安全属性,系统用该安全属性来决定一个主体是否可以访 问某个客体,具有较高的安全性。适用于专用或对安全性要求较高的系统,强制访问控制模型有多种模型,如 BLP、Biba、 clark- Wilson 和 chinesc 等。小李自学了 BLP 模型,并对该模型的特点进行了总结。以下 4 种 对 BLP 模型的描述中,正确的是 (  )","o":[{"k":"A","t":"BLP 模型用于保证系统信息的机密性,规则是向上读,向下写”"},{"k":"B","t":"BLP 模型用于保证系统信息的机密性,规则是“向下读,向上写”"},{"k":"C","t":"BLP 模型用于保证系统信息的完整性,规则是“向上读,向下写"},{"k":"D","t":"BLP 模型用于保证系统信息.的完整性,规则是“向下读,向上写"}],"a":"B","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-18","src":"精选300题","n":18,"q":"访问控制方法可分为自主访问控制、强制访问控制和基于角色的访问控制,他们具有不同的特点和应用 场景。如果需要选择一个访问控制方法,要求能够支持最小特权原则和职责分离原则,而且在不同的系统配 置下可以具有不同的安全控制,那么在下列选项中,能够满足以上要求的选项是 (  )","o":[{"k":"A","t":"自主访问控制"},{"k":"B","t":"强制访问控制"},{"k":"C","t":"基于角色的访问控制"},{"k":"D","t":"以上选项都可以"}],"a":"C","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-19","src":"精选300题","n":19,"q":"关于 Wi-FI 联盟提出的安全协议 WPA 和 WPA2 的区别,下面描述正确的是(  )","o":[{"k":"A","t":"WPA 是有线局域安全协议,而 WPA2 是无线局域网协议"},{"k":"B","t":"WPA 是适用于中国的无线局域安全协议,而 WPA2 适用于全世界的无线局域网协议"},{"k":"C","t":"WPA 没有使用密码算法对接入进行认证,而 WPA2 使用了密码算法对接入进行认证"},{"k":"D","t":"WPA 是依照 802.111 标准草案制定的,而 WPA2 是依照 802.111 正式标准制定的"}],"a":"D","topic":"密码学","partial":false},{"id":"core300-20","src":"精选300题","n":20,"q":"随着高校业务资源逐渐向数据中心高度集中,Web 成为一种普适平台,上面承载了越来越多的核心业务。 Web 的开放性带来丰富资源、高效率、新工作方式的同时,也使机构的重要信息暴露在越来越多的威胁中。 去年,某个…网站遭遇 SQL 群注入( Mass SQL Injectior)攻击,网站发布的重要信息被簒改成为大量签名,所以 该校在某信息安全公司的建议下配置了状态检测防火墙,其原因不包括 (  )","o":[{"k":"A","t":"状态检测防火墙可以应用会话信息决定过滤规则"},{"k":"B","t":"状态检测防火墙具有记录通过每个包的详细信息能力"},{"k":"C","t":"状态检测防火墙过滤规则与应用层无关,相比于包过滤防火墙更易安装和使用"},{"k":"D","t":"状态检测防火墙结合网络配置和安全规定做出接纳、拒绝、身份认证或报警等处理动作答"}],"a":"C","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-21","src":"精选300题","n":21,"q":"异常入侵检测是入侵检测系统常用的一种技术,它是识别系统或用户的非正常行为或者对于计算机资源 的非正常使用,从而检测出入侵行为。下面说法错误的是 (  )","o":[{"k":"A","t":"在异常入侵检测中,观察到的不是已知的入侵行为,而是系统运行过程中的异常现象"},{"k":"B","t":"实施异常入侵检测,是将当前获取行为数据和已知入侵攻击行为特征相比较,若匹配则认为有攻击发生"},{"k":"C","t":"异常入侵检测可以通过获得的网络运行状态数据,判断其中是否含有攻击的 的网站划分到 Internet、本地 Internet、受信任 的站点、受限制的站点等不同安全区域中,以采取不同的安全访问策略"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-37","src":"精选300题","n":37,"q":"下面对”零日(zero-day)漏洞”的理解中,正确的是 (  )","o":[{"k":"A","t":"指一个特定的漏洞,该漏洞每年 1 月 1 日零点发作,可以被攻击者用来远程攻击,获取主机 权限"},{"k":"B","t":"指一个特定的漏洞,特指在 2010 年被发现出来的一种漏洞,该漏洞被“震网”病毒所利用用来攻击伊朗布 什尔核电站基础设施"},{"k":"C","t":"指一类漏洞,即特别好被被利用,一旦成功利用该漏洞,可以在 1 天内完成攻击,且成功达到攻击目标"},{"k":"D","t":"指一类漏洞,即刚被发现后立即被恶意利用的安全漏洞。一般来说,那些已经被小部分人发现,但是还未公 布、还不存在安全补丁的漏洞都是零日漏洞"}],"a":"D","topic":"物理与运维安全","partial":false},{"id":"core300-38","src":"精选300题","n":38,"q":"为达到预期的攻击目的,恶意代码通常会被采用各种方法将自己隐藏起来。关于隐藏方法,下面理解错误 的是 (  )","o":[{"k":"A","t":"隐藏恶意代码进程,即将恶意代码进程隐藏起来,或者改名和使用系统进程名,以更好的躲避检测,迷惑用户 和安全检测人员"},{"k":"B","t":"隐藏恶意代码的网络行为,复用通用的网络端口,以躲避网络行为检测和网络监控"},{"k":"C","t":"隐藏恶意代码的源代码,删除或加密源代码,仅留下加密后的二进制代码,以躲避用户和安全检测人员"},{"k":"D","t":"隐藏恶意代码的文件,通过隐藏文件、采用流文件技术或 HOOK 技术、以躲避系统文件检査和清除"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-39","src":"精选300题","n":39,"q":"某网站管理员小邓在流量监测中发现近期网站的入站 ICMP 流量上升 250%尽管网站没有发现任何的 性能下降或其他问题,但为了安全起见,他仍然向主管领导提出了应对措施,作为主管负责人,请选择有效的 针对此问题的应对措施:(  )","o":[{"k":"A","t":"在防火墙上设置策略,阻止所有的 ICMP 流量进入(关掉 ping)"},{"k":"B","t":"删除服务器上的 ping.exe 程序"},{"k":"C","t":"增加带宽以应对可能的拒绝服务攻击"},{"k":"D","t":"增加网站服务以应对即将来临的拒绝服务攻击"}],"a":"A","topic":"网络与通信安全","partial":false},{"id":"core300-40","src":"精选300题","n":40,"q":"下面四款安全测试软件中,主要用于 WEB 安全扫描的是 (  )","o":[{"k":"A","t":"Cisco Auditing Tools"},{"k":"B","t":"Acunetix Web Vulnerability Scanner"},{"k":"C","t":"NMAP"},{"k":"D","t":"ISS Database Scanner"}],"a":"B","topic":"网络与通信安全","partial":false},{"id":"core300-41","src":"精选300题","n":41,"q":"关于 ARP 欺骗原理和防范措施,下面理解错误的是 (  )","o":[{"k":"A","t":"AR 欺骗是指攻击者直接向受害者主机发送错误的 ARP 应答报文,使得受害者主机将错误的硬件地址映 射关系存入到 ARP 缓存中,从而起到冒充主机的目的"},{"k":"B","t":"单纯利用 ARP 欺骗攻击时,ARP 欺骗通常影响的是内部子网,不能跨越路由实施攻击"},{"k":"C","t":"解决 ARP 欺骗的一个有效方法是采用“静态”的 ARP 缓存,如果发生硬件地址的更改,则需要人工更新 缓存"},{"k":"D","t":"彻底解决 ARP 欺骗的方法是避免使用 ARP 协议和 ARP 缓存,直接采用 IP 地址和其他主机进行连接"}],"a":"D","topic":"网络与通信安全","partial":false},{"id":"core30 理能力。关于 ISMS, 下面描述错误的是 (  )","o":[{"k":"A","t":"在组织中,应有信息技术责任部门(如信息中心)制定并颁布信息安全方针,为组织的 ISMS 建设指明方向并 提供总体纲领,明确总体要求"},{"k":"B","t":"组织的管理层应确保 ISMS 目标和相应的计划得以制定,信息安全管理目标应明确、可度量,风险管理计划 应具体、具备可行性"},{"k":"C","t":"组织的信息安全目标、信息安全方针和要求应传达到全组织范围内,应包括全体员工,同时也应传达客户、 合作伙伴和供应商等外部各方"},{"k":"D","t":"组织的管理层应全面了解组织所面临的信息安全风险,决定风险可接受级别和风险可接受准则,并确认接 受和相关残余风险"}],"a":"A","topic":"法律法规与标准","partial":false},{"id":"core300-62","src":"精选300题","n":62,"q":"在风险管理中,残余风险是指在实施了新的或增强的安全措施后还剩下的风险,关于残余风险,下面描述 错误的是 (  )","o":[{"k":"A","t":"风险处理措施确定以后,应编制详细的残余风险清单,并获得管理层对残余风险的书面批准,这也是风险管 理中的一个重要过程"},{"k":"B","t":"管理层确认接受残余风险,是对风险评估工作的一种肯定,表示管理层已经全面了解了组织 所面临的风险,并理解在风险一旦变为现实后,组织能够且必须承担引发的后果"},{"k":"C","t":"接受残余风险,则表明没有必要防范和加固所有的安全漏洞,也没有必要无限制地提高安全保护措施的强 度,对安全保护措施的选择要考虑到成本和技术的等因素的限制"},{"k":"D","t":"如果残余风险没有降低到可接受的级别,则只能被动地选择接受风险,即对风险不采取进一步的处理措施, 接受风险可能带来的结果"}],"a":"D","topic":"风险管理与评估","partial":false},{"id":"core300-63","src":"精选300题","n":63,"q":"GB T22080-2008《信息技术安全技术信息安全管理体系要求》指出,建立信息安全管理体系应参照 PDCA 模型进行,即信息安全管理体系应包括建立 ISMS、实施和运行 SMS、监视和评审 ISMS、保持和改进 ISMS 等过程,并在这些过程中应实施若干活动。请选出以下描述错误的选项(  )","o":[{"k":"A","t":"“制定 ISMS 方针”是建立 ISMS 阶段工作内容"},{"k":"B","t":"“实施培训和意识教育计划”是实施和运行 ISMS 阶段工作内容"},{"k":"C","t":"“进行有效性测量”是监视和评审 ISMS 阶段工作内容"},{"k":"D","t":"“实施内部审核”是保持和改进 ISMS 阶段工作内容"}],"a":"D","topic":"法律法规与标准","partial":false},{"id":"core300-64","src":"精选300题","n":64,"q":"若一个组织声称自己的 ISMS 符合 SO/EC27001 或 GBT22080 标准要求,其信息安全控制措施通常在以 下方面实施常规控制,不包括哪一项(  )","o":[{"k":"A","t":"信息安全方针、信息安全组织、资产管理"},{"k":"B","t":"人力资源安全、物力和环境安全、通信和操作管理"},{"k":"C","t":"访问控制、信息系统获取、开发和维护、符合性"},{"k":"D","t":"规划与建立 ISMS"}],"a":"D","topic":"法律法规与标准","partial":false},{"id":"core300-65","src":"精选300题","n":65,"q":"信息安全组织的管理涉及内部组织和外部各方面两个控制目标,为了实现对组织内部信息安全的有效管 理,应该实施常规的控制措施,不包括哪些选项(  )","o":[{"k":"A","t":"信息安全的管理承诺、信息安全协调、信息安全职责的分配"},{"k":"B","t":"信息处理设施的授权过程、保密性协议、与政府部门的联系"},{"k":"C","t":"与特定利益集团的联系、信息安全的独立评审"},{"k":"D","t":"与外部各方相关风险的识别、处理外部各方协议中的安全问题"}],"a":"D","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-66","src":"精选300题","n":66,"q":"若一个组织声称自己的 ISMS 符合 ISO 川 EC27001 或 GBT22080 标准要求,其信息安全措施通常需要在 资产管理方面实施常规控制,资产管理包含对资产负责和信息分类两个控制目标。信息分类控制的目标是为 了确保信息受到适当级别的保护,通常采取以下哪项控制措施 (  )","o":[{"k":"A","t":"资产清单"},{"k":"B","t":"资产责任人"},{"k":"C","t":"资产的可接受使用"},{"k":"D","t":"分类指南、信息的标记和处理"}],"a":"D","topic":"法律法规与标准","partial":false},{"id":"core300-67","src":"精选300题","n":67,"q":"应急响应时信息安全事件管理的重要内容之一。关于应急响应工作,下面描述错误的是 (  )","o":[{"k":"A","t":"信息安全应急响应,通常是指一个组织为了应对各种安全意外事件的发生所采取的防范措施,既包括预防 性措施,也包括事业发生后的应对措施"},{"k":"B","t":"应急响应工作有其鲜明的特点:具体高技术复杂性与专业性、强突发性、对知识经验的高依赖性,以及需要 广泛的协调与合作"},{"k":"C","t":"应急响应时组织在处置应对突发/重大信息安全事件时的工作,其主要包括两部分工作：安全事件发生时 正确指挥、事件发生后全面总结"},{"k":"D","t":"应急响应工作的起源和相关机构的成立和 198 年 11 月发生的莫里斯蠕虫病毒事件有关,基于该事件,人们 更加重视安全事件的应急处理和整体协调的重要性"}],"a":"C","topic":"应急响应与业务连续性","partial":false},{"id":"core300-68","src":"精选300题","n":68,"q":"我国依照信息系统的重要程度、安全事件造成的系统损失以及带来的社会影响等因素,将信息安全事件 分为若干个级别,其中,能够对特别重要的信息系统产生特别严重影响或破坏的信息安全事件,如使特别重要 信息系统遭受特别重大的系统损失,如造成系统大面积瘫痪,使其丧失业务处理能力,或系统关键数据的保密 性、完整性、可用性遭到严重破坏的,应属于哪一级信息安全事件 (  )","o":[{"k":"A","t":"I 级"},{"k":"B","t":"皿级"},{"k":"C","t":"W 级"},{"k":"D","t":"特别级"}],"a":"A","topic":"应急响应与业务连续性","partial":false},{"id":"core300-69","src":"精选300题","n":69,"q":"恢复时间目标( Recovery Time Objective, RTO)和恢复点目标( RECOVERY Point Objective, RPO)是业务连续性和灾难恢复工作中的两个重要指标,随着信息系统越来越重要和信息技术越 来越先进,这两个指标的数值越来越小。小华准备为其工作的信息系统拟定 RTO 和 RPO 指标,则以下描述 中,正确的是 (  )","o":[{"k":"A","t":"RTO 可以为 0,RPO 也可以为 0"},{"k":"B","t":"RTO 可以为 0,RPO 不可以为"},{"k":"C","t":"RT0 不可以为 0,RPO 可以为 0"},{"k":"D","t":"RT0 不可以为 0,RPO 也不可以为 0"}],"a":"A","topic":"应急响应与业务连续性","partial":false},{"id":"core300-70","src":"精选300题","n":70,"q":"随着信息技术的不断发展,信息系统的重要性也越来越突出,而与此同时,发生的信息安全事件也越来越 多。综合分析信息安全问题产生的根源,下面描述正确的是(  )","o":[{"k":"A","t":"信息系统自身存在脆弱性是根本原因。信息系统越来越重要,同时自身在开发、部署和使用过程中存在的 脆弱性,导致了诸多的信息安全事件发生。因此,杜绝脆弱性的存在是解决信息安全问题的根本所在"},{"k":"B","t":"信息系统面临诸多黑客的威胁,包括恶意攻击者和恶作剧攻击者。信息系统应用越来越广泛,接触信息系统 的人越多,信息系统越可能遭受攻击。因此,避免有恶意攻击可能的人接触信息系统就可以解决信息安全问 题"},{"k":"C","t":"信息安全问题产生的根源要从内因和外因两个方面分析,因为信息系统自身存在脆弱性,同时外部又有威 胁源,从而导致信息系统可能发生安全事件。因此,要防范信息安全风险,需从内外因同时着手"},{"k":"D","t":"信息安全问题的根本原因是内因、外因和人三个因素的综合作用,内因和外因都可能导致安全事件的发生, 但最重要的还是人的因素,外部攻击者和内部工作人员通过远程攻击、本地破坏和外勾结等手段导致安全事 件发生。因此,对人这个因素的防范应是安全工作重点"}],"a":"C","topic":"风险管理与评估","partial":false},{"id":"core300-71","src":"精选300题","n":71,"q":"关于信息安全保障技术框架( Information Assurance Tehnical Frameworkat-),下面描述错误的是 (  )","o":[{"k":"A","t":"IATF 最初由美国国家安全局(NSA)发布,后来由国际标准化组织(IS0)转化为国际标准,供各个国家信息系 统建设参考使用"},{"k":"B","t":"IATF 是一个通用框架,可以用到多种应用场景中,通过对复杂信息系统进行解构和描述,然 后再以此框架讨论信息系统的安全保护问题"},{"k":"C","t":"IATF 提出了深度防御的战略思想,并提供一个框架进行多层保护,以此防范信息系统面临的各种威胁"},{"k":"D","t":"强调人、技术和操作是深度防御的三个主要层面,也就是说讨论人在技术支持下运行维护的信息安全保障 问题"}],"a":"A","topic":"法律法规与标准","partial":false},{"id":"core300-72","src":"精选300题","n":72,"q":"关于信息安全保障技术框架(IATF)以下说法不正确的是 (  )","o":[{"k":"A","t":"分层策略允许在适当的时候采用低安全级保障解决方案以便降低信息安全保障的成本"},{"k":"B","t":"IATF 从人、技术和操作三个层面提供一个框架实施多层保护,使攻击者即使攻破一层也无法破坏整个信 息基础设施"},{"k":"C","t":"允许在关键区域(例如区域边界)使用高安全级保障解决方案,确保系统安全性"},{"k":"D","t":"IATF 深度防御战略要求在网络体系结构的各个可能位置实现所有信息安全保障机制"}],"a":"D","topic":"安全体系与模型","partial":false},{"id":"core300-73","src":"精选300题","n":73,"q":"2003 年以来,我国高度重视信息安全保障工作,先后制定并发布了多个文件,从政策层面为开展并推进信 息安全保障工作进行了规划。下面选项中哪个不是我国发布的文件 (  )","o":[{"k":"A","t":"《国家信息化领导小组关于加强信息安全保障工作的意见》(中办发[2003]27 号)"},{"k":"B","t":"《国家网络安全综合计划(CNCI)》(国令[2008]54 号)"},{"k":"C","t":"《国家信息安全战略报告》(国信[2005]2 号)"},{"k":"D","t":"《关于大力推进信息化发展和切实保障信息安全的若干意见》(国发[2012123 号)"}],"a":"B","topic":"综合","partial":false},{"id":"core300-74","src":"精选300题","n":74,"q":"在信息安全保障工作中,人オ是非常重要的因素,近年来,我国一直高度重视我国信息安全人オ队伍的培 养和建设。在以下关于我国关于人オ培养工作的描述中,错误的是 (  )","o":[{"k":"A","t":"在《国家信息化领导小组关于加强信息安全保障工作的意见》仲办发[2003]27 号)中,针对信息安全人才建 设与培养工作提出了“加快新鲜全人才培养,增强全民信息安全意识”的指导精神"},{"k":"B","t":"2015 年,为加快网络空间安全高层次人才培养,经报国务院学位委员会批准,国务院学位委员会、教育部决 定在“工学”门类下增设“网络空间安全”一级学科,这对于我国网络信息安全人才成体系化、规模化、系 统化培养起到积极的推动作用"},{"k":"C","t":"经过十余年的发展,我国信息安全人オ培养已经成熟和体系化,每年培养的信息安全从业人员的数量较多, 基本能同社会实际需求相匹配;同时,高校信息安全专业毕业人オ的综合能力要求高、知识更全面,因而社会 化培养应重点放在非安全专业人才培养上"},{"k":"D","t":"除正规大学教育外,我国信息安全人オ非学历教育已基本形成了以各种认证为核心,辅以各种职业技能培 训的信息安全人才培训体系,包括“注册信息安全专业人员(CISP)”资质认证和一些大型企业的信息安全资 质认证"}] A","t":"当用户请求访问某资源时,如果其操作权限不再用户当前被激活角色的授权范围内,访问请 求将被拒绝"},{"k":"B","t":"业务系统中的岗位、职位或者分工,可对应 RBAC 模型中的角色"},{"k":"C","t":"通过角色,可实现对信息资源访问的控制"},{"k":"D","t":"RBAC 模型不能实现多级安全中的访问控制"}],"a":"D","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-96","src":"精选300题","n":96,"q":"自主访问控制模型(DAC)的访问控制关系可以用访问控制(ACL)来表示,该 ACL 利用在客体上附加一个 主体明细表的方法来表示访问控制矩阵,通常使用由客体指向的链表来存储相关数据。下面选项中说法正确 的是(  )","o":[{"k":"A","t":"ACL 是 Be1l- Lapadula 模型的一种具体实现"},{"k":"B","t":"ACL 在删除用户时,去除该用户所有的访问权限比较方便"},{"k":"C","t":"ACL 对于统计某个主体能访问哪些客体比较方便"},{"k":"D","t":"ACL 在增加客体时,增加相关的访问控制权限较为简单"}],"a":"D","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-97","src":"精选300题","n":97,"q":"关于 Kerberos 认证协议,以下说法错误的是 (  )","o":[{"k":"A","t":"只要用户拿到了认证服务器(AS)发送的票据许可票据(TGT)并且该 TGT 没有过期,就可以使用该 TGT 通 过票据授权服务器(TGS)完成到任一个服务器的认证而不必重新输入密码"},{"k":"B","t":"认证服务器(AS)和票据授权服务器(TGS)是集中式管理,容易形成瓶颈,系统的性能和安全也严重依赖于 AS 和 TS 的性能和安全"},{"k":"C","t":"该协议通过用户获得票据许可票据、用户获得服务许可票据、用户获得服务三个阶段,仅支持服务器对用 户的单向认证"},{"k":"D","t":"该协议是一种基于对称密码算法的网络认证协议,随用户数量增加,密钥管理较复杂"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-98","src":"精选300题","n":98,"q":"传输控制协议(TCP)是传输层协议,以下关于 TCP 协议的说法,哪个是正确的? (  )","o":[{"k":"A","t":"相比传输层的另外一个协议 UDP,TCP 既提供传输可靠性,还同时具有更高的效率,因此具有广泛的用途"},{"k":"B","t":"TCP 协议包头中包含了源 IP 地址和目的 IP 地址,因此 TCP 协议负责将数据传送到正确的主机"},{"k":"C","t":"TCP 协议具有流量控制、数据校验、超时重发、接收确认等机制,因此 TCP 协议能完全替代 IP 协议"},{"k":"D","t":"TCP 协议虽然高可靠,但是相比 UDP 协议机制过于复杂,传输效率要比 UDP 低"}],"a":"D","topic":"网络与通信安全","partial":false},{"id":"core300-99","src":"精选300题","n":99,"q":"以下关于 UDP 协议的说法,哪个是错误的? (  )","o":[{"k":"A","t":"UDP 具有简单高效的特点,常被攻击者用来实施流量型拒绝服务攻击"},{"k":"B","t":"UDP 协议包头中包含了源端口号和目的端口号,因此 UDP 可通过端口号将数据包送达正确的程序"},{"k":"C","t":"相比 TCP 协议,UDP 协议的系统开销更小,因此常用来传送如视频这一类高流量需求的应用数据"},{"k":"D","t":"UDP 协议不仅具有流量控制,超时重发机制,还能提供加密等服务,因此常用来传输如视频会话这类需要 隐私保护的数据"}],"a":"D","topic":"密码学","partial":false},{"id":"core300-100","src":"精选300题","n":100,"q":"由于 Internet 的安全问题日益突出,基于 TCP/IP 协议,相关组织和专家在协议的不同层次设计了相应 的安全通信协议,用来保障网络各层次的安全。其中,属于或依附于传输层的安全协议是 (  )","o":[{"k":"A","t":"PP2P"},{"k":"B","t":"L2TP"},{"k":"C","t":"SSL"},{"k":"D","t":"IPSEC"}],"a":"C","topic":"网络与通信安全","partial":false},{"id":"core300-101","src":"精选300题","n":101,"q":"防火墙是网络信息系统建设中常常采用的一类产品,它在内外网隔离方面的作用是 (  )。","o":[{"k":"A","t":"既能物理隔离,又能逻辑隔离"},{"k":"B","t":"能物理隔离,但不能逻辑隔离"},{"k":"C","t":"不能物理隔离,但是能逻辑隔离"},{"k":"D","t":"不能物理隔离,也不能逻辑隔离"}],"a":"C","topic":"网络与通信安全","partial":false},{"id":"core300-103","src":"精选300题","n":103,"q":"S 公司在全国有 20 个分支机构,总部有 10 台服务器、200 个用户终端,每个分支机构都有一台服务器、 100 个左右用户终端,通过专用进行互联互通。公司招标的网络设计方案中,四家集成商给出了各自的 IP 地 址规划和分配的方法,作为评标专家,请给 S 公司选出设计最合理的一个:(  )","o":[{"k":"A","t":"总部使用服务器、用户终端统一使用 10.0.1.x、各分支机构服务和用户终端使用 192.168.2.x192.168.20.x"},{"k":"B","t":"总部使用服务器使用 10.0.1.111、用户终端使用 10.0.1.12212,分支机构 IP 地址随意确定即可"},{"k":"C","t":"总部服务器使用 10.0.1.x、用户终端根据部门划分使用 10.0.2.x、每个分支机构分配两个 A 类地址段,一个 用做服务器地址段、另外一个做用户终端地址段"},{"k":"D","t":"因为通过互联网连接,访问的是互联网地址,内部地址经 NAT 映射,因此 IP 地址无需特别规划,各机构自行 决定即可"}],"a":"C","topic":"网络与通信安全","partial":false},{"id":"core300-104","src":"精选300题","n":104,"q":"私有 IP 地址是一段保留的 IP 地址。只使用在局域网中,无法在 Internet 上使用。关于私有地址,下面 描述正确的是 (  )","o":[{"k":"A","t":"A 类和 B 类地址中没有私有地址,C 类地址中可以设置私有地址"},{"k":"B","t":"A 类地址中没有私有地址,B 类和类地址中可以设置私有地址"},{"k":"C","t":"A 类、B 类和 C 类地址中都可以设置私有地址"},{"k":"D","t":"A 类、B 类和 C 类地址中都没有私有地址"}],"a":"C","topic":"网络与通信安全","partial":false},{"id":"core300-105","src":"精选300题","n":105,"q":"张主任的计算机使用 Windows7 操作系统,他常登陆的用户名为 zhang,张主任给他个人文件夹设置了 权限为只有 zhang 这个用户有权访问这个目录,管理员在某次维护中无意将 zhang 这个用户删除了,随后又 重新建了一个用户名为 zhang,张主任使用 zhang 这个用户登录系统后,发现无法访问他原来的个人文件夹, 原因是(  )","o":[{"k":"A","t":"任何一个新建用户都需要经过授权才能访问系统中的文件"},{"k":"B","t":"Windows7 不认为新建立的用户 zhang 与原来的用户 zhang 是同一个用户,因此无权访"},{"k":"C","t":"用户被删除后,该用户创建的文件夹也会自动删除,新建用户找不到原来用户的文件夹,因此无法访问"},{"k":"D","t":"新建的用户 zhang 会继承原来用户的权限,之所以无权访问是因为文件夹经过了加密"}],"a":"A","topic":"密码学","partial":false},{"id":"core300-106","src":"精选300题","n":106,"q":"以下关于 Windows 系统的账号存储管理机制( Security Accounts Manager)的说法哪个是正确的 (  )","o":[{"k":"A","t":"存储在注册表中的账号数据是管理员组用户都可以访问,具有较高的安全性"},{"k":"B","t":"存储在注册表中的账号数据只有 administrator 账户オ有权访问,具有较高的安全性"},{"k":"C","t":"存储在注册表中的账号数据任何用户都可以直接访问,灵活方便"},{"k":"D","t":"存储在注册表中的账号数据有只有 System 账户オ能访问,具有较高的安全性"}],"a":"D","topic":"综合","partial":false},{"id":"core300-107","src":"精选300题","n":107,"q":"口令破解是针对系统进行攻击的常用方法, Windows 系统安全策略中应对口令破解的策略主要是账户 策略中的账户锁定策略和密码策略,关于这两个策略说明错误的是 (  )","o":[{"k":"A","t":"密码策略的主要作用是通过策略避免用户生成弱口令及对用户的口令使用进行管控"},{"k":"B","t":"密码策略对系统中所有的用户都有效"},{"k":"C","t":"账户锁定策略的主要作用是应对口令暴力破解攻击,能有效的保护所有系统用户被口令暴力破解攻击"},{"k":"D","t":"账户锁定策略只适用于普通用户,无法保护管理员 administrator 账户应对口令暴力破解攻击"}],"a":"D","topic":"密码学","partial":false},{"id":"core300-108","src":"精选300题","n":108,"q":"Windows 文件系统权限管理访问控制列表( Access Control List,ACL)机制,以下哪个说法是错误的 (  )","o":[{"k":"A","t":"安装 Windows 系统时要确保文件格式使用的是 NTFS,因为 Windows 的 ACL 机制需要 NTFS 文件格式 的支持"},{"k":"B","t":"由于 Windows 操作系统自身有大量的文件和目录,因此很难对每个文件和目录设置严格的访问权限,为了 使用上的便利, Windows 上的 ACL 存在默认设置安全性不高的问题"},{"k":"C","t":"Windows 的 ACL 机制中,文件和文件夹的权限是与主体进行关联的,即文件夹和文件的访问权限信息是写 在用户数据库中"},{"k":"D","t":"由于 ACL 具有很好的灵活性,在实际使用中可以为每一个文件设定独立用户的权限"}],"a":"C","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-109","src":"精选300题","n":109,"q":"由于发生了一起针对服务器的口令暴力破解攻击,管理员决定对设置账户锁定策略以对抗口令暴力破 解。他设置了以下账户锁定策略如下:复位账户锁定计数器 5 分钟账户锁定时间 10 分钟账户锁定阀值 3 次 无效登录以下关于以上策略设置后的说法哪个是正确的 (  )","o":[{"k":"A","t":"设置账户锁定策略后,攻击者无法再进行口令暴力破解,所有输错了密码的用户就会被锁住"},{"k":"B","t":"如果正常用户不小心输错了 3 次密码,那么该账户就会被锁定 10 分钟,10 分钟内即使输入正确的密码,也无 法登录系统"},{"k":"C","t":"如果正常用户不小心连接输入错误密码 3 次,那么该用户账户就被锁定 5 分钟,5 分钟内即使提交了正确的 密码,也无法登录系统"},{"k":"D","t":"攻击者在进行口令破解时,只要连续输错 3 次密码,该账户就被锁定 10 分钟,而正常用户登陆不受影响"}],"a":"B","topic":"密码学","partial":false},{"id":"core300-110","src":"精选300题","n":110,"q":"某 Linux 系统由于 root 口令过于简单,被攻击者猜解后获得了 root 口令,发现被攻击后,管理员更改了 root 口令,并请安全专家对系统进行检测,在系统中发现有一个文件的权限如下-r-s-X-x1 test test 10704 Apr 15 2002 /home/test/sh 请问以下描述哪个是正确的:(  )","o":[{"k":"A","t":"该文件是一个正常文件,是 test 用户使用的 shel1l,test 不能读该文件,只能执行"},{"k":"B","t":"该文件是一个正常文件,是 test 用户使用的 shel1,但 test 用户无权执行该文件"},{"k":"C","t":"该文件是一个后门程序,该文件被执行时,运行身份是 root,test 用户间接获得了 root 权限"},{"k":"D","t":"该文件是一个后门程序,可由于所有者是 test,因此运行这个文件时文件执行权限为 test"}],"a":"C","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-111","src":"精选300题","n":111,"q":"加密文件系统( Encrypting File System,EFS)是 Windows 操作系统的一个组件。以下说法错误的是 (  )","o":[{"k":"A","t":"EFS 采用加密算法实现透明的文件加密和解密,任何不拥有合适密钥的个人或者程序都不能加密数据"},{"k":"B","t":"EFS 以公钥加密为基础,并利用了 Windows 系统中的 Cryptoapi 体系结构"},{"k":"C","t":"EFS 加密系统适用于 NTFS 文件系统和 FAT32 文件系统( Windows7 环境下)"},{"k":"D","t":"EFS 加密过程对用户透明,ES 加密的用户验证过程是在登录 Windows 时进行"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-112","src":"精选300题","n":112,"q":"数据库的安全很复杂,往往需要考虑多种安全策略,才可以更好地保护数据库的安全。以下关于数据库 常用的安全策略理解不正确的是: (  )","o":[{"k":"A","t":"最小特权原则,是让用户可以合法的存取或修改数据库的前提下,分配最小的特权,使得这些信息恰好能够 完成用户的工作"},{"k":"B","t":"最大共享策略,在保证数据库的完整性、保密性和可用性的前提下,最大程度也共享数据库中的信息"},{"k":"C","t":"粒度最小策略,将数据库中的数据项进行划分,粒度越小,安全级别越高,在实际中需要选择最小粒度"},{"k":"D","t":"按内容存取控制策略,不同权限的用户访问数据库的不同部分"}],"a":"B","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-114","src":"精选300题","n":114,"q":"以下关于 SMTP 和 POP3 协议的说法那个是错误的 (  )","o":[{"k":"A","t":"SMTP 和 POP3 协议是一种基于 ASCI 编码的请求/响应模式的协议"},{"k":"B","t":"SMTP 和 POP3 协议明文传输数据,因此存在数据泄露的可能"},{"k":"C","t":"SMP 和 POP3 协议缺乏严格的用户认证,因此导致了垃圾邮件问题"},{"k":"D","t":"SMTP 和 POP3 协议由于协议简单,易用性更高,更容易实现远程管理邮件"}],"a":"D","topic":"综合","partial":false},{"id":"core300-115","src":"精选300题","n":115,"q":"金女土经常通过计算机在互联网上购物,从安全角度看,下面哪项是不好的操作习惯 (  )","o":[{"k":"A","t":"使用专用上网购物用计算机,安装好软件后不要对该计算机上的系统软件、应用软件进行升级"},{"k":"B","t":"为计算机安装具有良好声誉的安全防护软件,包括病毒査杀、安全检査和安全加固方面的软件"},{"k":"C","t":"在 IE 的配置中,设置只能下载和安装经过签名的、安全的 Active 控件"},{"k":"D","t":"在使用网络浏览器时,设置不在计算机中保留网络历史记录和表单数据"}],"a":"A","topic":"恶意代码与攻防","partial":false},{"id":"core300-116","src":"精选300题","n":116,"q":"应用安全,一般是指保障应用程序使用过程和结果的安全,以下内容中不属于应用安全防护考虑的是 (  )","o":[{"k":"A","t":"身份鉴别,应用系统应对登陆的用户进行身份鉴别,只有通过验证的用户才能访问应用系统资源"},{"k":"B","t":"安全标记,在应用系统层面对主体和客体进行标记,主体不能随意更改权限,增加访问控制的力度,限制非法 访问"},{"k":"C","t":"剩余信息保护,应用系统应加强硬盘、内存或缓冲区中剩余信息的保护,防止存储在硬盘、内存或缓冲区中 的信息被非授权的访问"},{"k":"D","t":"机房与设施安全,保证应用系统处于有一个安全的环境条件,包括机房环境、机房安全等级、机房的建造 和机房的装修等"}],"a":"D","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-117","src":"精选300题","n":117,"q":"下面对信息安全漏洞的理解中,错误的是 (  )","o":[{"k":"A","t":"讨论漏洞应该从生命周期的角度出发,信息产品和信息系统在需求、设计、实现、配置、维护和使用等阶 段中均有可能产生漏洞"},{"k":"B","t":"信息安全漏洞是由于信息产品和信息系统在需求、设计、开发、部署或维护阶段,由于设计、开发等相关 人员无意中产生的缺陷所造成的"},{"k":"C","t":"信息安全漏洞如果被恶意攻击者成功利用,可能会给信息产品和信息系统带来安全损害,甚至带来很大的 经济损失"},{"k":"D","t":"由于人类思维能力、计算机计算能力的局限性等因素,所以在信息产品和信息系统中产生信息安全漏洞是 不可避免的"}],"a":"B","topic":"综合","partial":false},{"id":"core300-118","src":"精选300题","n":118,"q":"某单位发生的管理员小张在繁忙的工作中接到了一个电话,来电者:小张吗?我是科技处李强,我的邮箱 密码忘记了,现在打不开邮件,我着急收个邮件,麻烦你先帮我把密码改成 123,我收完邮件自己修改掉密码。 热心的小张很快的满足了来电者的要求。随后李强发现有向系统登录异常。请问以下说法哪个是正确的? (  )","o":[{"k":"A","t":"小张服务态度不好,如果把李强的邮件收下来亲自教给李强就不会发生这个问题"},{"k":"B","t":"事件属于服务器故障,是偶然事件,影响单位领导申请购买新的服务器"},{"k":"C","t":"单位缺乏良好的密码修改操作流程或者小张没按操作流程工作"},{"k":"D","t":"事件属于邮件系统故障,是偶然事件,应向单位领导申请升级邮件服务软件"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-120","src":"精选300题","n":120,"q":"某单位计划在今年开发一套办公自化(OA)系统,将集团公司各地的机构通过互联网进行协同办公,在 OA 系统的设计方案评审会上,提出了不少安全开发的建议,作为安全专家,请指出大家提供的建议中不太合 适的一条 (  )","o":[{"k":"A","t":"对软件开发商提出安全相关要求,确保软件开发商对安全足够的重视,投入资源解决软件安全问题"},{"k":"B","t":"要求软件开发人员进行安全开发培训,是开发人员掌握基本软件安全开发知识"},{"k":"C","t":"要求软件开发商使用 Java 而不是 ASP 作为开发语言,避免产生 SQL 注入漏洞"},{"k":"D","t":"要求软件开发商对软件进行模块化设计,各模块明确输入和输出数据格式,并在使用前对输入数据进行校 验"}],"a":"C","topic":"软件安全开发","partial":false},{"id":"core300-121","src":"精选300题","n":121,"q":"某软件公司准备提高其开发软件的安全性,在公司内部发起了有关软件开发生命周期的讨论,在下面的 发言观点中,正确的是 (  )","o":[{"k":"A","t":"软件安全开发生命周期较长、阶段较多,而其中最重要的是要在软件的编码阶段做好安全措施就可以解决 90%以上的安全问题"},{"k":"B","t":"应当尽早在软件开发的需求和设计阶段就增加一定的安全措施,这样可以比在软件发布以后进行漏洞修 复所花的代价少得多"},{"k":"C","t":"和传统的软件开发阶段相比,微软提出的安全开发生命周期( Security Development Lifecycle,SDL)的最大特 点是增加了一个专门的安全编码阶段"},{"k":"D","t":"软件的安全测试也很重要,考虑到程序员的专业性,如果该开发人员已经对软件进行了安全性测试,就没有 必要在组织第三方进行安全性测试"}],"a":"B","topic":"软件安全开发","partial":false},{"id":"core300-122","src":"精选300题","n":122,"q":"下面有关软件安全问题的描述中,哪项应是由于软件设计缺陷引起的 (  )","o":[{"k":"A","t":"设计了三层 WEB 架构,但是软件存在 SQL 注入漏洞,导致被黑客攻击后直接访问数据库"},{"k":"B","t":"使用 C 语言开发时,采用了一些存在安全问题的字符串处理函数,导致存在缓冲区溢出漏洞"},{"k":"C","t":"设计了缓存用户隐私数据机制以加快系统处理性能,导致软件在发布运行后,被黑客攻击获取到用户隐私 数据"},{"k":"D","t":"使用了符合要求的密码算法,但在使用算法接口时,没有按照要求生成密钥,导致黑客攻击后能破解并得到 明文数据"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-123","src":"精选300题","n":123,"q":"某集团公司根据业务需要,在各地分支机构部署前置机,为了保证安全,集团总部要求前置机开发日志共 享,有总部服务器采集进行集中分析,在运行过程中发现攻击者也可通过共享从前置机中提取日志,从而导致 部分敏感信息泄,根据降低攻击面的原则,应采取哪项处理措施 (  )","o":[{"k":"A","t":"由于共享导致了安全问题,应直接关闭日志共享,禁止总部提取日志进行分析"},{"k":"B","t":"为配合总部的安全策略,会带来一定的安全问题,但不影响系统使用,因此接受此风险"},{"k":"C","t":"日志的存在就是安全风险,最好的办法就是取消日志,通过设置让前置机不记录日志"},{"k":"D","t":"只允许特定的 IP 地址从前置机提取日志,对日志共享设置,对日志共享设置访问密码且限定访问的时间"}],"a":"D","topic":"密码学","partial":false},{"id":"core300-124","src":"精选300题","n":124,"q":"针对软件的拒绝服务攻击是通过消耗系统资源是软件无法响应正常请求的一种攻击方式,在软件开发 时分析拒绝服务攻击的威胁,以下哪个不是需要考虑的攻击方式: (  )","o":[{"k":"A","t":"攻击者利用软件存在逻辑错误,通过发送某种类型数据导致运算进入死循环,CPU 资源占用始终 100%"},{"k":"B","t":"攻击者利用软件脚本使用多重嵌套査询,在数据最大时会导致查询效率低,通过发送大量的査询导致数据 库响应缓慢"},{"k":"C","t":"攻击者利用软件不自动释放连接的问题,通过发送大量连接消耗软件并发连接数,导致并发连接数耗尽而 无法访问"},{"k":"D","t":"攻击者买通了 IDC 人员,将某软件运行服务器的网线拨掉导致无法访问"}],"a":"D","topic":"综合","partial":false},{"id":"core300-125","src":"精选300题","n":125,"q":"最小特权是软件安全设计的基本原则,某应用程序在设计时,设计人员给出了以下四种策略,其中有一个 违反了最小特权的原则,作为评审专家,请指出是哪一个?(  )","o":[{"k":"A","t":"软件在 Alinux 下按照时,设定运行时使用 nobody 用户运行实例"},{"k":"B","t":"软件的日志备份模块由于需要备份所有数据库数据,在备份模块运行时,以数据库备份操作员账号连接数 据库"},{"k":"C","t":"软件的日志模块由于要向数据库中的日志表中写入日志信息,使用了一个日志用户账号连接数据库,该账 号仅对日志表拥有权限"},{"k":"D","t":"为了保证软件在 Windows 下能稳定的运行,设定运行权限为 system,确保系统运行正常,不会因为权限不 足产生运行错误"}],"a":"D","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-126","src":"精选300题","n":126,"q":"某网站为了开发的便利,使用 SA 连接数据库,由于网站脚本中被发现存在 SQL 注入漏洞,导致攻击者利 用内置存储过程 cmd shell 删除了系统中一个重要文件,在进行问题分析时,作为安全专家,你应该指出该网 站设计违反了以下哪项原则: (  )","o":[{"k":"A","t":"权限分离原贝"},{"k":"B","t":"最小特权原则"},{"k":"C","t":"保护最薄弱环节的原则"},{"k":"D","t":"纵深防御的原则"}],"a":"B","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-127","src":"精选300题","n":127,"q":"微软提出了 STRIDE(6 种威胁)三模型,其中,R 是 Repudiation(抵赖)的缔写,关于此项安全要求,下面 描述错误的是(  )","o":[{"k":"A","t":"某用户在登录系统并下载数据后,却声称“我没有下载过数据”,软件系统中的这种威胁就属于 R 威胁"},{"k":"B","t":"解决 R 威胁,可以选择使用抗抵赖性服务技术来解决,如强认证、数字签名、安全审计等技术措施"},{"k":"C","t":"R 威胁是 STRIDE 六种威胁中第三严重的威胁,比 D 威胁和 E 威胁的严重程度更高"},{"k":"D","t":"解决 R 威胁,也应按照确定建模对象、识别威胁、评估威胁以及消减威胁等四个步骤来进行"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-128","src":"精选300题","n":128,"q":"关于信息安全管理,下面理解片面的是 (  )","o":[{"k":"A","t":"信息安全管理是组织整体管理的重要、固有组成部分,它是组织实现其业务目标的重要保障"},{"k":"B","t":"信息安全管理是一个不断演进、循环发展的动态过程,不是一成不变的"},{"k":"C","t":"在信息安全建设中,技术是基础,管理是拔高,及有效的管理依赖于良好的技术基础"},{"k":"D","t":"坚持管理与技术并重的原则,是我国加强信息安全保障工作的主要原则之一"}],"a":"C","topic":"综合","partial":false},{"id":"core300-129","src":"精选300题","n":129,"q":"以下哪项制度或标准被作为我国的一项基础制度加以推行,并且有一定强制性,其实施的主要目标是有 效地提高我国信息和信息系统安全建设的整体水平,重点保障基础信息网络和重要信息系统的安全。(  )","o":[{"k":"A","t":"信息安全管理体系(ISMS"},{"k":"B","t":"信息安全等级保护"},{"k":"C","t":"NIST SP800 系列"},{"k":"D","t":"ISO270000 系列"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"core300-130","src":"精选300题","n":130,"q":"小王是某大学计算科学与技术专业的毕业生,大四上学期开始找工作,期望谋求一份技术管理的职位一 次面试中,某公司的技术经理让小王读一读信息安全风险管理中的背景建立”的基本概念与认识。小明的主 要观点包括:(1)背景建立的目的是为了明确信息安全风险管理的范围和对象,以及对象的特性和安全要求, 完成信息安全风险管理项目的规划和准备(2)背景建立根据组织机构相关的行业经验执行,雄厚的经验有助 于达到事半功倍的效果;(3)背景建立包括:风险管理准备、信息系统调查、信息系统分析和信息安全分析;(4) 背景建立的阶段性成果包括:风险管理计划书、信息系统的描述报告、信息系统的分析报告、信息系统的安 全要求报告。请问小王的论点中错误的是哪项: (  )","o":[{"k":"A","t":"第一个观点,背景建立的目的只是为了明确信息安全风险管理的范围和对象"},{"k":"B","t":"第二个观点,背景建立的依据是国家、地区或行业的相关政策、法律、法规和标准"},{"k":"C","t":"第三个观点,背景建立中的信息系统调査与信息系统分析是同一件事的两个不同名字"},{"k":"D","t":"第四个观点,背景建立的阶段性成果中不包括有风险管理计划书"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"core300-131","src":"精选300题","n":131,"q":"关于风险要素识别阶段工作内容叙述错误的是 (  )","o":[{"k":"A","t":"资产识别是指对需要保护的资产和系统等进行识别和分类"},{"k":"B","t":"威胁识别是指识别与每项资产相关的可能威胁和漏洞及其发生的可能性"},{"k":"C","t":"脆弱性识别以资产为核心,针对每一项需要保护的资产,识别可能被威胁利用的弱点,并对脆弱性的严重程 度进行评估"},{"k":"D","t":"确认已有的安全措施仅属于技术层面的工作,牽涉到具体方面包括:物理平台、系统平台、网络平台和应 用平台"}],"a":"D","topic":"风险管理与评估","partial":false},{"id":"core300-132","src":"精选300题","n":132,"q":"某单位的信息安全主管部门在学习我国有关信息安全的政策和文件后,认识到信息安全风险评估分为 自评估和检査评估两种形式。该部门将有关检查评估的特点和要求整理成如下四条报告给单位领导,其中描 述错误的是 (  )","o":[{"k":"A","t":"检查评估可依据相关标准的要 T 颁发的"},{"k":"B","t":"第一个子颁发机构是 21"},{"k":"C","t":"Windows NTE 的 SID 的三个子颁发机构是 1534169462、1651380828、11620651"},{"k":"D","t":"此 SID 以 500 结尾,表示内置 guest 账户"}],"a":"D","topic":"综合","partial":false},{"id":"core300-181","src":"精选300题","n":181,"q":"letc/passwd 文件是 Unxlinux 安全的关键文件之一。该文件用于用户登录时校验用户的登录名、加 密的口令数据项、用户 ID(UID)、默认的用户分组 ID(GID)、用户信息、用户登录目录以及登录后使用的 shell 程序。某黑客设法窃取了银行账户管理系统的 passwd 文件后,发现每个用户的加密的口令数据项都显 示为 x。下列选项中,对此现象的解释正确的是(  )","o":[{"k":"A","t":"黑客窃取的 passwd 文件是假的"},{"k":"B","t":"用户的登录口令经过不可逆的加密算法加密结果为'x"},{"k":"C","t":"加密口令被转移到了另一个文件里"},{"k":"D","t":"这些账户都被禁用了"}],"a":"C","topic":"密码学","partial":false},{"id":"core300-182","src":"精选300题","n":182,"q":"Linux 系统文件中访问权限属性通过 9 个字符来表示,分别表示文件属主、文件所属组用户和其他用 户对文件的读(r)、写(w)及执行(x)的权限。文件 usr/bin/ passwd 的属性信息如下图所示,在文件权限中还出 现了一位 S,下列选项中对这一位 s 的理解正确的是() - r-s --x - x 1 root root10704Apr2011: 55/usr/bin/passwd (  )","o":[{"k":"A","t":"文件权限出现了错误,出现 s 的位应该改为 x"},{"k":"B","t":"S 表示 sticky.位,设置 sticky 位后,就算用户对目录具有写权限,也不能删除该文件"},{"k":"C","t":"S 表示 SGID 位,文件在执行阶段具有文件所在组的权限"},{"k":"D","t":"S 表示 SUID 位,文件在执行阶段具有文件所有者的权限"}],"a":"D","topic":"综合","partial":false},{"id":"core300-183","src":"精选300题","n":183,"q":"Linux 系统的安全设置主要从磁盘分区、账户安全设置、禁用危险服务、远程登录安全、用户鉴别 安全、审计策略、保护 root 账户、使用网络防火墙和文件权限操作共 10 个面来完成。小张在学习了 Linux 系统安全的相关知识后,尝试为自己计算机上的 Linux 系统进行安全配置。下列选项是他的部分操作,其中 不合理的是(  )","o":[{"k":"A","t":"编辑文件/etc/ passwd.检査文件中用户 ID,禁用所有 ID=0 的用户"},{"k":"B","t":"编辑文件/etc/ssh/ sshd config,将 Permitrootlogin 设置为 no"},{"k":"C","t":"编辑文件/etc/pam,d/ system-auth,设置 auth required pam tal1y.so oner=faildeny=unlock time=300"},{"k":"D","t":"编辑文件/etc/ profile,设置 TMOUT=600"}],"a":"A","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-184","src":"精选300题","n":184,"q":"目前,信息系统面临外部攻击者的悉意攻击威胁,从威胁能力和掌握资源分,这些威胁可以按照个人威胁、 组织威胁和国家威胁三个层面划分,则下面选项中属于组织威胁的是 (  )","o":[{"k":"A","t":"喜欢恶作剧、实现自我挑战的娱乐型黑客"},{"k":"B","t":"实施犯罪、获取非法经济利益网络犯罪团伙"},{"k":"C","t":"搜集政治、军事、经济等情报信息的情报机构"},{"k":"D","t":"现固战略优势,执行军事任务、进行目标破坏的信息作战部队"}],"a":"B","topic":"综合","partial":false},{"id":"core300-185","src":"精选300题","n":185,"q":"以下哪种风险被认为是合理的风险 (  )","o":[{"k":"A","t":"最小的风险"},{"k":"B","t":"残余的风险"},{"k":"C","t":"未识别的风险"},{"k":"D","t":"可接受的风险"}],"a":"D","topic":"综合","partial":false},{"id":"core300-186","src":"精选300题","n":186,"q":"规划的实施流程和文档管理,是信息安全风险评估能否取得成果的重要基础。某单位在实施风险评估 时,按照规范形成了若干文档,其中,下面()中的文档应属于风险评估中风险要素识别”阶段输出的文档 (  )","o":[{"k":"A","t":"《风险评估方案》,主要包括本次风险评估的目的、范围、目标、评估步骤、经费预算和进离安排等内容"},{"k":"B","t":"《风险评估方法和工具列表》主要包括拟用的风险评估方法和测试评估工具等内容"},{"k":"C","t":"《风险评估准则要求》,主要包括现有风险评估参考标准、采用的风险分析方法、资产分类标准等内容"},{"k":"D","t":"《已有安全措施列表》,主要包括经检査确认后的已有技术和管理各方面安全措施等内容答"}],"a":"D","topic":"风险管理与评估","partial":false},{"id":"core300-187","src":"精选300题","n":187,"q":"以下关于互联网协议安全( Internet Protocol Security, Ipsec)协议说法错误的是 (  )","o":[{"k":"A","t":"在传送模式中,保护的是 IP 负载"},{"k":"B","t":"验证头协议( Authentication Head,AH)和 IP 圭寸装安全载荷协议( Encapsulating Security Pay load,ESP)都能以传输模式和隧道模式工作"},{"k":"C","t":"在隧道模式中,保护的是整个互联网协议( InternetProtoco1,IP)包,包括 IP 头"},{"k":"D","t":"Ipsec 仅能保证传输数据的可认证性和保密性"}],"a":"D","topic":"网络与通信安全","partial":false},{"id":"core300-188","src":"精选300题","n":188,"q":"某个新成立的互联网金融公司拥有 10 个与互联网直接连接的 P 地址,但是该网络内有 15 台个人计算 机,这些个人计算机不会同时开机并连接互联网。为解决公司员工的上网问题,公司决定将这 10 个互联网地 址集中起来使用,当任意一台个人计算机开机并连接网络时,管理中心从这 10 个地址中任意取出一个尚未分 配的 P 地址分配给这个人的计算机。他关机时,管理中心将该地为收回,并重新设置为未分配。可见只要同 时打开的个人计算机数量少于或等于可供分配的 P 地址,那么每中个人计算机可获取一个 IP 地址,并实现与 互联网的连接,该公司使用的 IP 地址规划方式是(  )","o":[{"k":"A","t":"静态分配地址"},{"k":"B","t":"动态分配地址"},{"k":"C","t":"静态 MAT 分配地址"},{"k":"D","t":"端口 NAT 分配地址"}],"a":"B","topic":"网络与通信安全","partial":false},{"id":"core300-189","src":"精选300题","n":189,"q":"在 inux 系统中,下列哪项内容不包含在/ etc/passwd 文件中(  )","o":[{"k":"A","t":"用户名"},{"k":"B","t":"用户口令"},{"k":"C","t":"用户主目录"},{"k":"D","t":"用户登录后使用的 SHEL"}],"a":"B","topic":"访问控制与身份鉴别","partial":false},{"id":"core300-190","src":"精选300题","n":190,"q":"某市环卫局网络建设是当地政府投资的重点项目。总体目标就是用交换式水平布线,由大型的交换机 和路由器连通几个主要的工作区域,在各个区域建立通过网络传输到各监控中心。其中对交换机和路由器进 行配置是网络安全中的一,和路由器的安全配置,操作错误的是 (  )","o":[{"k":"A","t":"保持当前版本的操作系统,不定期更新交换机操作系统补丁"},{"k":"B","t":"控制交换机的物理访问端口,关闭空闲的物理端口"},{"k":"C","t":"带外管理交换机,如果不能实现的话,就可以利用单独的 VLAN 号进行带内管理"},{"k":"D","t":"安全配置必要的网络服务,关闭不必要的网络服务"}],"a":"A","topic":"网络与通信安全","partial":false},{"id":"core300-191","src":"精选300题","n":191,"q":"应急响应是信息事件管理的重要内容。基于应急响应工作的特点和事件的不规则性,事先制定出事件 应急响应方法和过程,有助于一个组织在事件发生时阻止混乱的发生或是在混乱状态中迅速恢复控制,将损 失和负面影响降到最低。应急响应方法和过程并不是唯一的。一种被广为接受的应急响应管理过程分为 6 个阶段为准备一检测-遏制-根除-恢复-跟踪总结。请问下列说法有关于信息安全应急响应管理过程错误 的是 (  )","o":[{"k":"A","t":"确定重要资产和风险,实施针对风险的防护措施是信息安全应急响应规划过程中最关键的步骤"},{"k":"B","t":"在检测阶段,首先要进行监测、报告及信息收集"},{"k":"C","t":"遏制措施可能会因为事件的类别和级别不同而完全不同,常见的遏制措施有:完全关闭所有系统拔掉网线"},{"k":"D","t":"应按照应急响应计划中事先制定的业务恢复优先顺序和恢复步骤,顺次恢复相关的系统。"}],"a":"C","topic":"应急响应与业务连续性","partial":false},{"id":"core300-192","src":"精选300题","n":192,"q":"小张新购入了一台安装了 words 操作系统的笔记本电脑,为了提升操作系统的安全性,小张在 words 系统中的“本地安全策略”中配置了四类安全策略:账号策略、本地策略、公钥策略和 IP 安全策略,那么该 操作属于操作系统安全配置内容中的(  )","o":[{"k":"A","t":"关闭不必要的服务"},{"k":"B","t":"制定操作系统的策略"},{"k":"C","t":"关闭不必要的端口"},{"k":"D","t":"开启审核策略"}],"a":"B","topic":"密码学","partial":false},{"id":"core300-193","src":"精选300题","n":193,"q":"随着互联网”概念的普及,越来越多的新兴住宅小区引入了“智能楼宇”的理念,某物业为提供高档次 的服务,防止网络主线路出现故障,保证小区内网络服务的可用,稳定、高效,计划通过网络冗余配置的是(  )","o":[{"k":"A","t":"接入互联网时,同时采用不同电信运营商线路,相互备份且互不影响。"},{"k":"B","t":"核心层、汇聚层的设备和重要的接入层设备均应双机设备。"},{"k":"C","t":"规划网络 IP 地址,制定网络 IP 地址分配策略"},{"k":"D","t":"保证网络带宽和网络设备的业务处理能力具务冗余空间,满足业务高峰期和业务发展需求"}],"a":"B","topic":"网络与通信安全","partial":false},{"id":"core300-194","src":"精选300题","n":194,"q":"下列关于软件安全开发中的 BSI( Build Security In)系列模型说法错误的是(  )","o":[{"k":"A","t":"BIS 含义是指将安全内建到软件开发过程中,而不是可有可无,更不是游离于软件开发生命周期之外"},{"k":"B","t":"软件安全的三根支柱是风险管理、软件安全接触点和安全测试"},{"k":"C","t":"软件安全触点是软件开发生命周期中一套轻量级最优工程化方法,它提供了从不同角度保障安全的行为 方式"},{"k":"D","t":"BSⅠ系列模型强调应该使用工程化的方法来保证软件安全,即在整个软件开发生命周期中都要确保将安 全作为软件的一个有机组成部分"}],"a":"B","topic":"风险管理与评估","partial":false},{"id":"core300-195","src":"精选300题","n":195,"q":"访问控制是对用户或用户访问本地或网络上的域资源进行法令一种机制。在 Windows2000 以后的操 作系统版本中,访问控制是一种双重机制,它对用户的授权基于用户权限和对象许可,通常使用 ACL、访问令 牌和授权管理器来实现访问控制功能。以下选项中对 windows 操作系统访问控制实现方法的理解错误的 是(  )","o":[{"k":"A","t":"ACL 只能由 胁就是漏洞"}],"a":"D","topic":"软件安全开发","partial":false},{"id":"suppA-37","src":"补充100题 A卷","n":37,"q":"某商贸公司信息安全管理员考虑到信息系统对业务影响越来越重要，计划编制本单位信息安全应急 响应预案在向主管领导写报告时，他列举了编制信息安全应急响应预案的好处和重要性，在他罗列的四 条理由中，其中不适合为理由的一条是()","o":[{"k":"A","t":"应急预案是明确关键业务系统信息安全应急响应相挥体系和工作机制的重要方式"},{"k":"B","t":"应预案是提高应对网络和信息系统突发事件能力,减少突发事件造成的损失和危害,保障信息系统运 行平稳、安全、有序、高效的手段"},{"k":"C","t":"编制应急预案是国家网络安全法对所有单位的强制要求，因此必须建设"},{"k":"D","t":"应急预案是保障单位业务系统信息安全的重要措施"}],"a":"C","topic":"法律法规与标准","partial":false},{"id":"suppA-38","src":"补充100题 A卷","n":38,"q":"IS00001-2000 标准鼓励在制定.实施质量管理体系以及改进其有效性时采用过程方法，通过满足顾客 要求,地进顾客满意度.下图是关于过程方法的示意图，图中括号空白处应填写()。","o":[{"k":"A","t":"策略"},{"k":"B","t":"管理者"},{"k":"C","t":"组织"},{"k":"D","t":"活动"}],"a":"D","topic":"安全管理体系","partial":false},{"id":"suppA-40","src":"补充100题 A卷","n":40,"q":"Kerberos 协议是常用的集中访问控制协议，通过可信第三方的认证服务，减轻应用服务器的负担。 Kerberos 的运行环境由密钥分发中心(KDC)、应用服务器和客户端三个部分组成。其中，KDC 分为认证 服务器 AS 和票据授权服务器 TGS 两部分。下图展示了 Kerberos 协议的三个阶段，分别为(1)Kerberos 获得服务许可票据，(2) Kerberos 获得服务，(3)Kerberos 获得票据许可票据。下列选项中，对这三 个阶段的排序正确的是()。","o":[{"k":"A","t":"(1)-(2)-(3)"},{"k":"B","t":"(3)-(2)一(1)"},{"k":"C","t":"(2)-(1)一(3)"},{"k":"D","t":"(3)一(1)一(2)"}],"a":"D","topic":"密码学","partial":false},{"id":"suppA-41","src":"补充100题 A卷","n":41,"q":"关于对信息安全事件进行分类分级管理的原因描述不正确的是().","o":[{"k":"A","t":"信息安全事件的种类很多，产重程度也不尽相同，其响应和处理方式也应各不相同"},{"k":"B","t":"对信息安全事件进行分类和分级管理，是有效防范和响应信息安全事件的基础"},{"k":"C","t":"能够使事前准备、事中应对和事后处理的各项相关工作更具针对性和有效性"},{"k":"D","t":"我国早期的计算机安全事件的应急响应工作主要包括计算机病毒防范和“千年虫”问题的解决，关于 网络安全应急响应的起步最早"}],"a":"D","topic":"应急响应与业务连续性","partial":false},{"id":"suppA-42","src":"补充100题 A卷","n":42,"q":"某集团公司信息安全管理员根据领导安排制定了下一年度的培训工作计划，提出了四大培训任务和 目标，关于这四个培训任务和目标，作为主管领导，以下选项中不合理的是()","o":[{"k":"A","t":"由于网络安全上升到国家安全的高度，网络安全必须得到足够的重视。因此安排了对集团公司下属单 位的总经理(一把手)的网络安全法培训"},{"k":"B","t":"对下级单位的网络安全管理岗人员实施全面安全培训，建议通过 CISP 培训以确保人员能力得到保障"},{"k":"C","t":"对其他信息化相关人员(网络管理员、软件开发人员)也进行安全基础培训，使相关人员对网络安全有 所了解"},{"k":"D","t":"对全体员工安排信息安全意识及基础安全知识培训，实现全员信息安全意识教育"}],"a":"C","topic":"法律法规与标准","partial":false},{"id":"suppA-44","src":"补充100题 A卷","n":44,"q":"在国家标准 GB/T 20274.1-2006《信息安全技术信息系统安全保障评估框架第一部分:简介和一般模 型》中，信息系统安全保障模型包含哪几个方面?()","o":[{"k":"A","t":"保障要素、生命周期和运行维护"},{"k":"B","t":"保障要素、生命周期和安全特征"},{"k":"C","t":"规划组织、生命周期和安全特征"},{"k":"D","t":"规划组织、生命周期和运行维护"}],"a":"B","topic":"法律法规与标准","partial":false},{"id":"suppA-45","src":"补充100题 A卷","n":45,"q":"某信息安全公司的团队对某款名为“红包快抢”的外挂进行分析，发现此外挂是一个典型的木马后 门，使黑客能够获得受害者电脑的访问权。该后门程序为了达到长期驻留在受害者的计算机中，通过修 改注册表启动项来达到后门程序随受害者计算机系统启动而启动。为防范此类木马后门的攻击，以下做 法无用的是()。","o":[{"k":"A","t":"不下载、不执行、不接收来历不明的软件或文件"},{"k":"B","t":"修改用户名和口令"},{"k":"C","t":"不随意打开来历不明的邮件，不浏览不健康不正规的网站"},{"k":"D","t":"安装反病毒软件和防火墙，安装专门的木马防治软件"}],"a":"B","topic":"访问控制与身份鉴别","partial":false},{"id":"suppA-46","src":"补充100题 A卷","n":46,"q":"若一个组织声称自己的 ISMS 符合 ISO/IEC27001 或 GB/T22080 标准要求,其信息安全控制措施通常需 要在物理和环境安全方面实施常规控制。物理和环境安全领域包括安全区域和设备安全两个控制目标。 安全区域的控制目标是防止对组织场所和信息的未授权物理访问、损坏和干扰，关键或敏感的信息及信 息处理设施应放在安全区域内,并受到相应保护,该目标可以通过以下控制措施来实现,不包括哪一项()","o":[{"k":"A","t":"物理安全边界、物理入口控制"},{"k":"B","t":"办公室、房间和设施的安全保护，外部和环境威胁的安全防护"},{"k":"C","t":"通信安全、合规性"},{"k":"D","t":"在安全区域工作，公共访问、交接区安全"}],"a":"C","topic":"法律法规与标准","partial":false},{"id":"suppA-48","src":"补充100题 A卷","n":48,"q":"PDC 循环又叫戴明环，是管理学常用的一种模型。关于 PDCA 四个字母，下面理解错误的是()。","o":[{"k":"A","t":"P 是 Prepare，指准备，包括明确对象、方法，制定活动规划"},{"k":"B","t":"D 是 Do，指实施、月体运作，实现计划中的内容"},{"k":"C","t":"c 是 Check，指检查、总结执行计划的结果，明确效果，找出问题"},{"k":"D","t":"A 是 Act 或 Adjut.指改进、完善和处理,对总结检查的结果进行处理。对成功的经验加以肯定,并予以 标准化,总结失败的教训并加以重视,对没有解决的问题，应该交给下一个 PDCA 环解决"}],"a":"A","topic":"法律法规与标准","partial":false},{"id":"suppA-49","src":"补充100题 A卷","n":49,"q":"小华在某电子商务公司工作。某天他在查看信息系统设计文档时，发现其中标注该信息系统的 RPO(恢复点目标)指标为 3 小时，请同这意味着()。","o":[{"k":"A","t":"该信息系统发生重大信息安全事件后，工作人员应在 3 小时内到位，完成问题定位和应急处理工作"},{"k":"B","t":"该信息系统发生重大信息安全事件后，工作人员应在 3 小时内完成应急处理工作，并恢复对外运行"},{"k":"C","t":"若该信总系统发生重大信息安全事件，工作人员在完成处置和灾难恢复工作后，系统至多能丢失 3 小 时的业务类"},{"k":"D","t":"若该信息系统发生重大信息安全事件，工作人员在完成处置和灾难恢复工作后，系统运行 3 小时后能 恢复全部数"}],"a":"C","topic":"应急响应与业务连续性","partial":false},{"id":"suppA-50","src":"补充100题 A卷","n":50,"q":"随机进程名称是恶意代码迷惑管理员和系统安全检查人员的技术手段之一，以下对于随机进程名技 术。描述正确的是()。","o":[{"k":"A","t":"随机进程名技术虽然每次进程名都是随机的，但是只要找到了进程名称，就找到了恶意代码程序本身"},{"k":"B","t":"恶意代码生成随机进程名称的目的是使进程名称不固定，因为杀毒软件是按进程名称进行病毒进程 查杀，"},{"k":"C","t":"恶意代码使用随机进程名是通过生成特定格式的进程名称，使进程管理器中看不到恶意代码的进程"},{"k":"D","t":"随机进程名技术每次启动时随机生成恶意代码进程名称，通过不确定的进程名称使自己不容易被发现 真实的恶意代码程序名称。"}],"a":"D","topic":"恶意代码与攻防","partial":false},{"id":"suppA-51","src":"补充100题 A卷","n":51,"q":"小王在学为定最风险评站方法后，快定试着为单位机房计算火灾的风险大小、假设单位机房的总价 值为 400 万元人民币、桑露系数(Exposure Factor,6F)是 25%，年度发生率(Annualined Rate of Oecurrence, ARO)为 0.2、那么小王计算的年度预期损失(Annualined Loss xpectancy， ALE)应该是()、","o":[{"k":"A","t":"100 万元人民币"},{"k":"B","t":"400 万元人民币"},{"k":"C","t":"20 万元人民币"},{"k":"D","t":"180 万元人民币"}],"a":"C","topic":"风险管理与评估","partial":false},{"id":"suppA-52","src":"补充100题 A卷","n":52,"q":"应急响应是信息安全事件管理的重要内容、基于应急响应工作的特点和事件的不规则性，事先制定 出事件应急响应方法和过程，有助于一个组织在事件发生时院止混乱的发生成是在混配状态中迅速恢复 控制，将损失和负面影响降到最低，应急响应方法和过程并不是唯一的，一种被广为按受的应急响应方 法是将应急响应管理过程分为 6 个阶段，为准备>检测>送制>根除>>快复>跟踪总结，请问下列说法有关 于信息安全应急响应管理过程错误的是","o":[{"k":"A","t":"确定重要资产和风险，实施针对风险的防护措施是信息安全应想响应规划过程中最关健的步理"},{"k":"B","t":"在检测阶段，首先要进行监测、报告及信息收集"},{"k":"C","t":"遏制措施可能会因为事件的类别和级别不同而完全不同。常见的遏制措施有:完全关闭所有系统、拔 掉网线等"},{"k":"D","t":"应按照应急响应计划中事先制定的业务恢复优先顺序和恢复步骤，顺次恢复相关的系统"}],"a":"C","topic":"应急响应与业务连续性","partial":false},{"id":"suppA-57","src":"补充100题 A卷","n":57,"q":"以下关于 Windows 操作系统身份标识与签别，说法不正确的是().","o":[{"k":"A","t":"本地安全授权机构(LSA)生成用户账户在该系统内唯一的安全标识符(SID)"},{"k":"B","t":"用户对鉴别信息的操作，如更改密码等都通过一个以 Administrator 权限运行的服务“Security Account Manager”来实现"},{"k":"C","t":"Windows 操作系统远程登录经历了 SMB 签别机制、LM 签别机制、NTLM 鉴别机制、Kerberos 签别体 系等阶段"},{"k":"D","t":"完整的安全标识符(SID)包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值"}],"a":"B","topic":"密码学","partial":false},{"id":"suppA-58","src":"补充100题 A卷","n":58,"q":"王工是某单位的系统管理员，他在某次参加了单位组织的风险管理工作时，发现当前案例中共有两 个重要资产:资产 A1 和资产 2:其中资产 A1 面临两个主要威胁:威胁 T1 和威胁 T2;而资产 A2 面临一个 主要胁:威胁 T3:威胁 T1 可以利用的资产 A1 存在的两个脆弱性:脆弱性 V1 和脆弱性 V2:威胁 T2 可以利用的资产 A1 存在的三个脆弱性，脆弱性 V3、脆弱性 V4 和脆弱性 V5:威胁 T3 可以利用的资产 A2 存在的两个脆性:脆弱性 V6 和脆弱性 V7. 根据上述条件，请问:使用相乘法时，应该为资产 A1 计算几 个风险值()   <script>
/* CISP 自检 — 百词斩式学习逻辑
 *
 * 核心模型（每题一张"卡片"）：
 *   box     0..5   Leitner 盒子，决定复习间隔
 *   due     时间戳  到期才会进入复习队列
 *   streak  连续答对次数
 *   seen / right / wrong  统计
 *
 * 状态机：
 *   新卡(box 0) --答对--> box1 ... --box5--> 已掌握
 *               --答错--> 回到 box1，并进入错题本
 *   已掌握的卡仍会按最长间隔抽查，答错则跌回 box2。
 */
(function () {
  'use strict';

  const L = ['A', 'B', 'C', 'D'];
  const DAY = 86400000;
  // 各盒子的复习间隔（天）。box0 = 未学。
  const INTERVALS = [0, 1, 2, 4, 7, 15];
  const MASTER_BOX = 5;
  const STORE = 'cisp-quiz-v1';

  const BANK = window.BANK || [];

  // ---------- 持久化 ----------

  const defaults = () => ({
    cards: {},           // id -> {box, due, streak, seen, right, wrong, wrongBook}
    daily: { date: '', newDone: 0, reviewDone: 0 },
    goal: 20,            // 每日新题目标
    reviewGoal: 60,      // 每日复习上限
    streakDays: 0,
    lastStudy: '',
    history: [],         // [{date, learned, correct, total}]
    exams: [],           // [{date, score, total, spent}]
  });

  let S = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return defaults();
      const d = JSON.parse(raw);
      return Object.assign(defaults(), d);
    } catch (e) {
      console.warn('读取进度失败，已重置', e);
      return defaults();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify(S));
    } catch (e) {
      toast('进度保存失败：存储空间不足');
    }
  }

  const todayStr = () => new Date().toISOString().slice(0, 10);

  function card(id) {
    if (!S.cards[id]) {
      S.cards[id] = { box: 0, due: 0, streak: 0, seen: 0, right: 0, wrong: 0, wrongBook: false };
    }
    return S.cards[id];
  }

  function rollDay() {
    const t = todayStr();
    if (S.daily.date !== t) {
      // 结算昨天，维护连续学习天数
      if (S.daily.date) {
        const gap = (new Date(t) - new Date(S.daily.date)) / DAY;
        const studied = S.daily.newDone + S.daily.reviewDone;
        if (studied > 0 && gap <= 1) S.streakDays++;
        else if (studied > 0) S.streakDays = 1;
        else if (gap > 1) S.streakDays = 0;
      }
      S.daily = { date: t, newDone: 0, reviewDone: 0 };
      save();
    }
  }

  // ---------- 队列 ----------

  const byId = new Map(BANK.map((q) => [q.id, q]));

  function dueCards() {
    const now = Date.now();
    return BANK.filter((q) => {
      const c = S.cards[q.id];
      return c && c.box > 0 && c.due <= now;
    });
  }

  function newCards() {
    return BANK.filter((q) => !S.cards[q.id] || S.cards[q.id].box === 0);
  }

  function wrongBook() {
    return BANK.filter((q) => S.cards[q.id] && S.cards[q.id].wrongBook);
  }

  function mastered() {
    return BANK.filter((q) => S.cards[q.id] && S.cards[q.id].box >= MASTER_BOX);
  }

  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  // 学习会话：先复习到期的，再上新题（和百词斩一致：复习优先）
  const SESSION_CAP = 20; // 知识域专项每轮题量

  function buildSession(opts) {
    const topic = opts.topic && opts.topic !== '全部' ? opts.topic : null;
    const mode = opts.mode;
    const inTopic = (arr) => (topic ? arr.filter((q) => q.topic === topic) : arr);

    if (mode === 'wrong') return shuffle(inTopic(wrongBook()));
    if (mode === 'review') return shuffle(inTopic(dueCards()));
    if (mode === 'exam') return shuffle(BANK).slice(0, Math.min(100, BANK.length));

    if (mode === 'topic') {
      // 知识域专项：不受每日配额限制，优先到期复习与未学新题，
      // 都练完了就从该域全部题目里随机抽，保证永远有题可练。
      const due = inTopic(dueCards());
      const fresh = inTopic(newCards());
      let pool = shuffle(due).concat(shuffle(fresh));
      if (!pool.length) pool = shuffle(inTopic(BANK));
      return pool.slice(0, SESSION_CAP);
    }

    // 每日学习：复习优先，再按目标上新题
    const reviewLeft = Math.max(0, S.reviewGoal - S.daily.reviewDone);
    const newLeft = Math.max(0, S.goal - S.daily.newDone);
    const rev = shuffle(inTopic(dueCards())).slice(0, reviewLeft);
    const nw = shuffle(inTopic(newCards())).slice(0, newLeft);
    const pool = rev.concat(nw);
    // 今日配额已满时也允许继续加练，而不是返回空队列
    if (!pool.length) return shuffle(inTopic(BANK)).slice(0, SESSION_CAP);
    return pool;
  }

  // ---------- 评分 ----------

  function grade(q, correct) {
    const c = card(q.id);
    const wasNew = c.box === 0;
    c.seen++;
    if (correct) {
      c.right++;
      c.streak++;
      c.box = Math.min(MASTER_BOX, c.box + 1);
      // 连续答对两次后移出错题本
      if (c.wrongBook && c.streak >= 2) c.wrongBook = false;
    } else {
      c.wrong++;
      c.streak = 0;
      c.wrongBook = true;
      // 已掌握的题答错跌到 box2，其余回到 box1
      c.box = c.box >= MASTER_BOX ? 2 : 1;
    }
    const days = INTERVALS[c.box] || 1;
    // 加入 ±10% 抖动，避免复习量在同一天堆积
    const jitter = 0.9 + Math.random() * 0.2;
    c.due = Date.now() + days * DAY * jitter;

    if (wasNew) S.daily.newDone++;
    else S.daily.reviewDone++;
    S.lastStudy = todayStr();
    save();
    return c;
  }

  // ---------- DOM 工具 ----------

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };

  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- 视图：首页 ----------

  function renderHome() {
    rollDay();
    const view = $('#view');
    view.innerHTML = '';
    view.className = 'view';

    const total = BANK.length;
    const learned = BANK.filter((q) => S.cards[q.id] && S.cards[q.id].box > 0).length;
    const mast = mastered().length;
    const due = dueCards().length;
    const wrong = wrongBook().length;
    const newLeft = Math.max(0, S.goal - S.daily.newDone);
    const pct = total ? Math.round((mast / total) * 100) : 0;

    // 进度环
    const ring = el('div', 'ring-wrap');
    ring.innerHTML = `
      <svg viewBox="0 0 120 120" class="ring" role="img" aria-label="已掌握 ${pct}%">
        <circle cx="60" cy="60" r="52" class="ring-bg"/>
        <circle cx="60" cy="60" r="52" class="ring-fg"
          stroke-dasharray="${(pct / 100) * 326.7} 326.7"/>
      </svg>
      <div class="ring-txt"><b>${pct}%</b><span>已掌握</span></div>`;

    const hero = el('section', 'card hero');
    hero.appendChild(ring);
    const heroInfo = el('div', 'hero-info');
    heroInfo.innerHTML = `
      <h2>CISP 自检</h2>
      <p class="muted">共 ${total} 题 · 已学 ${learned} · 掌握 ${mast}</p>
      <div class="chips">
        <span class="chip">连续 ${S.streakDays} 天</span>
        <span class="chip ${due ? 'hot' : ''}">待复习 ${due}</span>
        <span class="chip ${wrong ? 'warn' : ''}">错题 ${wrong}</span>
      </div>`;
    hero.appendChild(heroInfo);
    view.appendChild(hero);

    // 今日任务
    const task = el('section', 'card');
    task.appendChild(el('h3', null, '今日任务'));
    const bar = el('div', 'task-row');
    bar.innerHTML = `
      <div class="task">
        <span>新题</span>
        <div class="pbar"><i style="width:${S.goal ? Math.min(100, (S.daily.newDone / S.goal) * 100) : 0}%"></i></div>
        <b>${S.daily.newDone}/${S.goal}</b>
      </div>
      <div class="task">
        <span>复习</span>
        <div class="pbar"><i style="width:${S.reviewGoal ? Math.min(100, (S.daily.reviewDone / S.reviewGoal) * 100) : 0}%"></i></div>
        <b>${S.daily.reviewDone}/${S.reviewGoal}</b>
      </div>`;
    task.appendChild(bar);

    const startBtn = el('button', 'btn primary big', newLeft || due ? '开始学习' : '今日任务已完成 · 继续加练');
    startBtn.onclick = () => startSession({ mode: 'study', topic: $('#topicSel') ? $('#topicSel').value : '全部' });
    task.appendChild(startBtn);
    view.appendChild(task);

    // 模式
    const modes = el('section', 'card');
    modes.appendChild(el('h3', null, '练习模式'));
    const grid = el('div', 'mode-grid');
    const mk = (title, sub, fn, disabled) => {
      const b = el('button', 'mode' + (disabled ? ' disabled' : ''));
      b.innerHTML = `<b>${title}</b><span>${sub}</span>`;
      if (disabled) b.disabled = true;
      else b.onclick = fn;
      return b;
    };
    grid.appendChild(mk('复习到期', `${due} 题`, () => startSession({ mode: 'review' }), !due));
    grid.appendChild(mk('错题本', `${wrong} 题`, () => startSession({ mode: 'wrong' }), !wrong));
    grid.appendChild(mk('模拟考试', '100 题 · 计分', () => startSession({ mode: 'exam' })));
    grid.appendChild(mk('浏览题库', `${total} 题`, renderBrowse));
    modes.appendChild(grid);
    view.appendChild(modes);

    // 分类
    const cat = el('section', 'card');
    cat.appendChild(el('h3', null, '按知识域练习'));
    const topics = {};
    for (const q of BANK) topics[q.topic] = (topics[q.topic] || 0) + 1;
    const sel = el('select', 'sel');
    sel.id = 'topicSel';
    sel.appendChild(el('option', null, '全部'));
    Object.entries(topics).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
      const o = el('option', null, `${k} (${v})`);
      o.value = k;
      sel.appendChild(o);
    });
    cat.appendChild(sel);

    const tlist = el('div', 'topic-list');
    Object.entries(topics).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
      const qs = BANK.filter((q) => q.topic === k);
      const m = qs.filter((q) => S.cards[q.id] && S.cards[q.id].box >= MASTER_BOX).length;
      const row = el('button', 'topic');
      row.innerHTML = `<span class="tname">${k}</span>
        <span class="pbar sm"><i style="width:${Math.round((m / v) * 100)}%"></i></span>
        <span class="tnum">${m}/${v}</span>`;
      row.onclick = () => startSession({ mode: 'topic', topic: k });
      tlist.appendChild(row);
    });
    cat.appendChild(tlist);
    view.appendChild(cat);

    // 设置 + 数据
    const set = el('section', 'card');
    set.appendChild(el('h3', null, '设置'));
    const g1 = el('label', 'field');
    g1.innerHTML = `<span>每日新题</span><input type="number" min="5" max="200" value="${S.goal}" id="goalIn">`;
    const g2 = el('label', 'field');
    g2.innerHTML = `<span>每日复习上限</span><input type="number" min="10" max="400" value="${S.reviewGoal}" id="revIn">`;
    set.appendChild(g1);
    set.appendChild(g2);
    const row = el('div', 'btn-row');
    const sv = el('button', 'btn', '保存');
    sv.onclick = () => {
      S.goal = Math.max(5, Math.min(200, +$('#goalIn').value || 20));
      S.reviewGoal = Math.max(10, Math.min(400, +$('#revIn').value || 60));
      save();
      toast('已保存');
      renderHome();
    };
    const rs = el('button', 'btn ghost', '重置进度');
    rs.onclick = () => {
      if (!confirm('确定清空全部学习进度？此操作不可恢复。')) return;
      S = defaults();
      S.daily.date = todayStr();
      save();
      toast('进度已清空');
      renderHome();
    };
    row.appendChild(sv);
    row.appendChild(rs);
    set.appendChild(row);

    if (S.exams.length) {
      const h = el('div', 'exam-hist');
      h.appendChild(el('h4', null, '历史成绩'));
      S.exams.slice(-5).reverse().forEach((e) => {
        const line = el('div', 'exam-line');
        line.innerHTML = `<span>${e.date}</span><b>${e.score}/${e.total}</b><span class="muted">${Math.round((e.score / e.total) * 100)}%</span>`;
        h.appendChild(line);
      });
      set.appendChild(h);
    }
    view.appendChild(set);
  }

  // ---------- 视图：答题 ----------

  let sess = null;

  function startSession(opts) {
    rollDay();
    const queue = buildSession(opts);
    if (!queue.length) {
      toast(opts.mode === 'wrong' ? '错题本是空的' : '没有待练习的题目');
      return;
    }
    sess = {
      mode: opts.mode,
      topic: opts.topic,
      queue,
      i: 0,
      right: 0,
      wrong: 0,
      answered: [],
      started: Date.now(),
      isExam: opts.mode === 'exam',
      again: [],  // 本轮答错的题，会在末尾再考一遍（百词斩式即时巩固）
    };
    renderQuiz();
  }

  function renderQuiz() {
    const view = $('#view');
    view.innerHTML = '';
    view.className = 'view quiz';

    if (sess.i >= sess.queue.length) {
      // 本轮结束，若有答错的题且非考试模式，再来一轮
      if (!sess.isExam && sess.again.length) {
        sess.queue = shuffle(sess.again);
        sess.again = [];
        sess.i = 0;
        toast('错题再练一遍');
      } else {
        return renderResult();
      }
    }

    const q = sess.queue[sess.i];
    const c = S.cards[q.id] || { box: 0 };

    // 顶栏
    const top = el('div', 'qtop');
    const back = el('button', 'icon-btn', '‹');
    back.setAttribute('aria-label', '返回首页');
    back.onclick = () => {
      if (sess.i > 0 && !confirm('退出当前练习？已答题目的进度会保留。')) return;
      sess = null;
      renderHome();
    };
    top.appendChild(back);

    const prog = el('div', 'qprog');
    prog.innerHTML = `<i style="width:${(sess.i / sess.queue.length) * 100}%"></i>`;
    top.appendChild(prog);
    top.appendChild(el('span', 'qcount', `${sess.i + 1}/${sess.queue.length}`));
    view.appendChild(top);

    // 卡片
    const cardEl = el('section', 'card qcard');
    const meta = el('div', 'qmeta');
    meta.appendChild(el('span', 'tag', q.topic));
    meta.appendChild(el('span', 'tag ghost', q.src));
    if (!sess.isExam) {
      const boxNames = ['新题', '生疏', '认识', '熟悉', '较熟', '掌握'];
      meta.appendChild(el('span', 'tag lvl', boxNames[c.box] || '新题'));
    }
    if (q.partial) meta.appendChild(el('span', 'tag warn', '原题残缺'));
    cardEl.appendChild(meta);
    cardEl.appendChild(el('p', 'stem', q.q));

    const opts = el('div', 'opts');
    q.o.forEach((o) => {
      const b = el('button', 'opt');
      b.innerHTML = `<span class="k">${o.k}</span><span class="t"></span>`;
      $('.t', b).textContent = o.t;
      b.onclick = () => choose(q, o.k, opts, cardEl);
      b.dataset.k = o.k;
      opts.appendChild(b);
    });
    cardEl.appendChild(opts);
    view.appendChild(cardEl);
    window.scrollTo(0, 0);
  }

  function choose(q, k, optsEl, cardEl) {
    if (optsEl.dataset.done) return;
    optsEl.dataset.done = '1';
    const correct = k === q.a;

    $$('.opt', optsEl).forEach((b) => {
      b.disabled = true;
      if (b.dataset.k === q.a) b.classList.add('right');
      else if (b.dataset.k === k) b.classList.add('wrong');
    });

    if (correct) sess.right++;
    else {
      sess.wrong++;
      if (!sess.isExam) sess.again.push(q);
    }
    sess.answered.push({ id: q.id, pick: k, correct });
    grade(q, correct);

    // 反馈
    const fb = el('div', 'feedback ' + (correct ? 'ok' : 'no'));
    const c = S.cards[q.id];
    const nextDays = INTERVALS[c.box] || 1;
    fb.innerHTML = `<b>${correct ? '正确' : '答错了，正确答案 ' + q.a}</b>
      <span class="muted">${correct ? `下次复习：${nextDays} 天后` : '已加入错题本'}</span>`;
    cardEl.appendChild(fb);

    const next = el('button', 'btn primary big', sess.i + 1 >= sess.queue.length ? '完成' : '下一题');
    next.onclick = () => { sess.i++; renderQuiz(); };
    cardEl.appendChild(next);
    next.focus();
  }

  function renderResult() {
    const view = $('#view');
    view.innerHTML = '';
    view.className = 'view';
    const total = sess.answered.length;
    const score = sess.answered.filter((a) => a.correct).length;
    const spent = Math.round((Date.now() - sess.started) / 1000);
    const pct = total ? Math.round((score / total) * 100) : 0;

    if (sess.isExam) {
      S.exams.push({ date: todayStr(), score, total, spent });
      save();
    }

    const c = el('section', 'card center');
    c.appendChild(el('div', 'big-score', `${pct}%`));
    c.appendChild(el('p', null, `答对 ${score} / ${total} 题 · 用时 ${Math.floor(spent / 60)} 分 ${spent % 60} 秒`));
    if (sess.isExam) {
      c.appendChild(el('p', 'muted', pct >= 70 ? '达到 CISP 及格线（70%）' : '未达 70% 及格线，继续加油'));
    }

    const wrongs = sess.answered.filter((a) => !a.correct);
    if (wrongs.length) {
      const h = el('div', 'wrong-list');
      h.appendChild(el('h4', null, `错题回顾 (${wrongs.length})`));
      // 同一题可能在一轮里出现两次，只列一次
      const seen = new Set();
      wrongs.forEach((a) => {
        if (seen.has(a.id)) return;
        seen.add(a.id);
        const q = byId.get(a.id);
        const row = el('details', 'wrow');
        const sum = el('summary', null, q.q.slice(0, 60) + (q.q.length > 60 ? '…' : ''));
        row.appendChild(sum);
        q.o.forEach((o) => {
          const line = el('div', 'wopt' + (o.k === q.a ? ' right' : o.k === a.pick ? ' picked' : ''));
          line.textContent = `${o.k}. ${o.t}`;
          row.appendChild(line);
        });
        h.appendChild(row);
      });
      c.appendChild(h);
    }

    const row = el('div', 'btn-row');
    const again = el('button', 'btn primary', '再练一组');
    again.onclick = () => startSession({ mode: sess.mode, topic: sess.topic });
    const home = el('button', 'btn ghost', '回首页');
    home.onclick = () => { sess = null; renderHome(); };
    row.appendChild(again);
    row.appendChild(home);
    c.appendChild(row);
    view.appendChild(c);
    window.scrollTo(0, 0);
  }

  // ---------- 视图：浏览 ----------

  function renderBrowse() {
    const view = $('#view');
    view.innerHTML = '';
    view.className = 'view';

    const bar = el('section', 'card');
    const back = el('button', 'btn ghost', '‹ 返回');
    back.onclick = renderHome;
    bar.appendChild(back);
    const search = el('input', 'search');
    search.placeholder = '搜索题干或选项…';
    bar.appendChild(search);
    const info = el('p', 'muted', '');
    bar.appendChild(info);
    view.appendChild(bar);

    const list = el('div', 'browse');
    view.appendChild(list);

    function draw(filter) {
      list.innerHTML = '';
      const f = (filter || '').trim().toLowerCase();
      const hits = BANK.filter((q) => {
        if (!f) return true;
        return (q.q + q.o.map((o) => o.t).join('')).toLowerCase().includes(f);
      });
      info.textContent = `${hits.length} 题`;
      hits.slice(0, 300).forEach((q) => {
        const c = S.cards[q.id];
        const d = el('details', 'brow');
        const s = el('summary');
        s.innerHTML = `<span class="bt">${q.topic}</span> ${q.q.slice(0, 70)}${q.q.length > 70 ? '…' : ''}`;
        if (c && c.box >= MASTER_BOX) s.classList.add('done');
        d.appendChild(s);
        q.o.forEach((o) => {
          const line = el('div', 'wopt' + (o.k === q.a ? ' right' : ''));
          line.textContent = `${o.k}. ${o.t}`;
          d.appendChild(line);
        });
        const st = el('div', 'muted small', c
          ? `答过 ${c.seen} 次 · 对 ${c.right} 错 ${c.wrong}`
          : '未作答');
        d.appendChild(st);
        list.appendChild(d);
      });
      if (hits.length > 300) list.appendChild(el('p', 'muted', '仅显示前 300 条，请细化搜索'));
    }

    let t = null;
    search.oninput = () => { clearTimeout(t); t = setTimeout(() => draw(search.value), 150); };
    draw('');
  }

  // ---------- 启动 ----------

  if (!BANK.length) {
    document.getElementById('view').innerHTML =
      '<section class="card"><h3>题库未加载</h3><p class="muted">缺少 bank.js，请先运行 node build-bank.mjs 生成题库。</p></section>';
    return;
  }
  rollDay();
  renderHome();
})();

  </script>
</body>
</html>
